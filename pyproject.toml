[project]
# PyPI distribution name. The import package remains ``habit`` (see packages).
# The literal name "HABIT" is prohibited on PyPI (admin block / name policy),
# so we publish as ``habitat-analysis``: pip install habitat-analysis
name = "habitat-analysis"
version = "2.0.0"
description = "Habitat Analysis: Biomedical Imaging Toolkit (HABIT)"
# PyPI long description must be English by default. Keep README.md (Chinese) in
# the repository and sdist for bilingual readers; language switcher links use
# absolute GitHub URLs because relative paths break on pypi.org.
readme = "README_en.md"
# HABIT supports CPython 3.10–3.14 (verified on Windows: full check suite on
# 3.10, install + smoke on 3.13/3.14). PyRadiomics is never declared as a pip
# dependency (Windows PyPI sdists are broken; PyPI rejects direct wheel URLs
# in uploaded metadata). Install it separately — see docs/tutorial/installation.rst.
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Li Chao", email = "lichao19870617@163.com" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# HABIT is a library first: runtime dependencies use compatible ranges so the
# package can coexist with other scientific-Python stacks (sklearn / MONAI /
# PyRadiomics pipelines). Exact pins belong to lock files / CI, never to this
# metadata.
#
# THIS LIST IS A WHITELIST, not a convenience dumping ground. It contains only
# what the habitat kernel cannot run without, and
# tests/test_packaging_contracts.py asserts it equals an explicit set: adding
# an entry here turns that test red on purpose. Everything else -- plotting,
# DICOM, parquet/xlsx, SLIC, tabular ML, survival, registration, PyRadiomics --
# lives in the extras below and raises OptionalDependencyError (naming the
# extra and printing the pip command) when used without its extra.
#
# Two groups, and nothing else:
#   * the habitat kernel itself -- numpy / scipy / pandas / scikit-learn /
#     SimpleITK / networkx / numba. These are the imaging + clustering +
#     graph / MSI mathematics; there is no HABIT without them, and together
#     they dominate the install size (~450 MB plus numba's llvmlite) with
#     no way to shrink that without deleting the product.
#   * the plumbing every code path crosses -- pydantic (contract validation),
#     PyYAML (config), click (the `habit` console script), tqdm (the shared
#     progress bar), joblib (parallel map), kneed (elbow selection of the
#     habitat count). ~6.7 MB in total, so demoting any of them would add an
#     install-time decision for no measurable benefit.
dependencies = [
    # numpy 2.x is fully supported (verified: full check suite + golden tests
    # under numpy 2.2.6). Extensions built against numpy 2 headers also run on
    # numpy 1.26, so one build covers both generations.
    "numpy>=1.26,<3",
    "SimpleITK>=2.2,<3",
    "scipy>=1.11,<2",
    "pandas>=2.1,<3",
    "scikit-learn>=1.4,<2",
    # Exclude pydantic 2.11.x: npe2 (pulled by optional [view]/napari)
    # cannot build PluginManifest there (Draft06JsonSchema / model_rebuild;
    # npe2 declares pydantic!=2.11.*,>=2.8). HABIT itself is fine on 2.7–2.10
    # and on 2.12+.
    "pydantic>=2.7,!=2.11.*,<3",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
    "tqdm>=4.66,<5",
    "joblib>=1.3,<2",
    # Elbow/knee selection of the habitat count (habit.kernels
    # .cluster_selection). 0.1 MB with no transitive dependencies of its own,
    # and it is habitat kernel logic rather than an optional backend.
    "kneed>=0.8,<1",
    # Graph-topology habitat features (habit.kernels.habitat_graph): every
    # region-graph metric is a NetworkX computation. Pure Python, ~3 MB, no
    # required transitive dependencies of its own.
    "networkx>=3.0,<4",
    # JIT for MSI / habitat-graph / union-find / CSR graph kernels.
    # llvmlite is the size cost; 0.63+ is the CPython 3.14 wheel floor;
    # cap below 0.68 covers current 0.67.
    "numba>=0.63,<0.68",
]

[project.scripts]
habit = "habit.cli:cli"

# Plugin entry-point groups are intentionally NOT declared here: setuptools
# strips empty groups from the generated metadata, so empty declarations would
# be dead weight. Third-party plugins declare the groups in their own
# packaging metadata, for example:
#   [project.entry-points."habit.supervoxelizer"]
#   my_slic = "my_pkg.supervoxel:MySlic"
#   [project.entry-points."habit.combiner"]
#   my_combiner = "my_pkg.combiners:MyCombiner"
#   [project.entry-points."habit.pooling"]
#   my_pool = "my_pkg.pooling:MyPoolMarker"
# and `habit.load_plugins()` discovers them at run time. The authoritative
# group list lives in `habit/api/plugins.py::_ENTRY_POINT_GROUPS` and is
# documented in docs/source/api/plugins.rst.

[project.optional-dependencies]
# PyRadiomics is installed separately (never pulled by HABIT extras):
#   * Windows: pip-install the matching win_amd64 wheel from the HABIT GitHub
#     Release v1.0.2 (see docs/tutorial/installation.rst)
#   * macOS / Linux: ``pip install "pyradiomics>=3.0.1,<3.2"`` or conda-forge
# The empty ``radiomics`` extra is kept as a documented alias so existing
# ``pip install "habitat-analysis[radiomics]"`` commands stay valid; it does
# not install PyRadiomics.
radiomics = []
# Interactive napari viewer for habitat maps (`habit view --backend napari`).
# Medium weight: full `napari[pyqt5]` wheel set is ~177 MB download; on a
# typical HABIT env the net new install is ~80–120 MB (dominated by PyQt5
# ~55 MB + vispy / dask / napari-console). Default `habit view` stays on
# matplotlib via the `viz` extra and needs no Qt. Not pulled into `[all]`.
# Reinforce pydantic!=2.11.* so `pip install ...[view]` cannot leave a broken
# npe2/PluginManifest stack when an older env already had pydantic 2.11.
view = [
    "napari[pyqt5]>=0.4.19,<0.8",
    "npe2>=0.8.2",
    "pydantic!=2.11.*,>=2.8,<3",
    # Off-screen 3D habitat-graph surfaces/networks (habit.viz.habitat_graph).
    "pyvista>=0.43,<1",
]
# Every figure HABIT can draw. ~57.8 MB installed, of which ~31.4 MB is
# matplotlib's own transitive tail (pillow, fonttools, kiwisolver, contourpy).
# habit.viz imports matplotlib lazily inside each plotting function, so the
# habitat kernel never touches this extra.
viz = [
    "matplotlib>=3.8,<4",
    "seaborn>=0.13,<1",
]
# DICOM reading (`habit dicom-info`, `habit sort-dicom`). ~20.5 MB, used by
# exactly one module (habit/utils/dicom_utils.py); NIfTI / NRRD input needs
# nothing beyond the required SimpleITK.
dicom = [
    "pydicom>=3.0,<4",
]
# pandas engines for the non-CSV table formats: parquet (pyarrow, ~83.4 MB --
# by far the largest single item that was previously mandatory) and xlsx
# (openpyxl, ~1.7 MB). Neither is imported by HABIT directly; both are engines
# pandas loads at run time.
#
# NOTE: habitats_results_format still defaults to `parquet`, so a bare install
# that runs a habitat analysis without this extra fails with an explicit
# OptionalDependencyError offering both exits (install [tables], or set
# habitats_results_format: csv). It never silently switches format.
tables = [
    # pyarrow 22 is the first release shipping CPython 3.14 wheels; keep the
    # tested 15–21 range on 3.10–3.13 so existing installs stay untouched.
    "pyarrow>=15,<22; python_version < '3.14'",
    "pyarrow>=22,<23; python_version >= '3.14'",
    "openpyxl>=3.1,<4",
]
# SLIC supervoxels. ~43.7 MB (incl. ~16.4 MB of networkx / imageio / tifffile)
# for one function, skimage.segmentation.slic. The kernel contract is the
# Supervoxelizer PROTOCOL, and the default backends (kmeans / gmm feature
# clustering) need nothing extra, exactly as the ANTs registration backend is
# one option behind the `registration` extra rather than a required dependency.
slic = [
    "scikit-image>=0.23,<0.27",
]
# Empty documented alias: numba is now a required dependency. Kept so
# existing ``pip install "habitat-analysis[accel]"`` commands stay valid.
accel = []
# Full tabular-ML workflow: gradient-boosted model, resampling, and the
# statistical feature selectors (stepwise / univariate-logistic / VIF / mRMR).
# The selectors draw their own diagnostic figures and read feature tables from
# xlsx/parquet, so this extra pulls `viz` and `tables` in as well.
ml = [
    "habitat-analysis[tables,viz]",
    "xgboost>=2.1,<4",
    "imbalanced-learn>=0.12,<1",
    "mrmr-selection>=0.2.8,<1",
    "statsmodels>=0.14,<1",
]
# ANTs-based image registration backend for the preprocessing workflow.
registration = [
    "antspyx>=0.4.2,<1",
]
# Statistical analysis and survival modelling. Every report it produces is a
# figure or a spreadsheet, so `viz` and `tables` come with it.
analysis = [
    "habitat-analysis[tables,viz]",
    "krippendorff>=0.8,<1",
    "shap>=0.45,<1",
    "plotly>=5.20,<7",
    # 0.5.4 is the oldest release exposing the ICC API HABIT calls, and the
    # verified Windows environment runs 0.5.5; do not raise this floor above
    # that verified version.
    "pingouin>=0.5.4,<1",
    # Survival analysis: lifelines covers Kaplan-Meier, log-rank and CoxPH;
    # scikit-survival adds the sklearn-compatible estimators (random survival
    # forest, gradient boosting) and the C-index / Brier-score metrics.
    "lifelines>=0.28,<1",
    "scikit-survival>=0.23,<1",
]
automl = [
    "autogluon.tabular[lightgbm,catboost]>=1.2,<2",
]
# Convenience meta-extra: every optional workflow dependency at once.
# Written as self-referencing extras (setuptools + pip both resolve them, and
# it is verified by tests/test_packaging_contracts.py) so this list cannot
# drift out of sync with the groups it aggregates.
#
# `torch` stays out on purpose: CUDA wheel selection needs a --index-url the
# library metadata must not dictate. PyRadiomics stays out too (install
# separately; see docs/tutorial/installation.rst). `[view]` stays out (Qt).
all = [
    "habitat-analysis[analysis,automl,dicom,ml,registration,slic,tables,viz]",
]
# Migration alias for anyone upgrading from <=1.0.4, where matplotlib, seaborn,
# scikit-image, pydicom, pyarrow and openpyxl were REQUIRED dependencies.
# `pip install "habitat-analysis[full]"` reproduces everything a pre-1.1.0
# `pip install habitat-analysis` plus `[all]` used to provide, so the migration
# is a single word. Kept as its own name -- rather than telling users to switch
# to `[all]` -- so the upgrade instruction stays stable even if the membership
# of `all` changes later.
full = [
    "habitat-analysis[all]",
]
# Torch is an optional backend in HABIT's Python API. Keep only the supported
# API range here so CUDA wheel selection stays outside library metadata.
torch = [
    "torch>=2.4,<3",
]
# MONAI Rand3DElastic image / ROI warp (``BSplineDeformPerturbation``).
# Cap below 1.6: MONAI 1.6 declares torch>=2.8, which would fight HABIT's
# ``torch`` extra (2.4–<3) on a ``pip install habitat-analysis[monai]``.
monai = [
    "habitat-analysis[torch]",
    "monai>=1.3.2,<1.6",
]

# Poetry remains able to identify the supported interpreter, but all runtime
# package requirements live exclusively in ``project.dependencies`` above.
[tool.poetry.dependencies]
python = ">=3.10,<3.15"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
black = "^21.5b2"
mypy = "^0.910"
pylint = "^2.9.0"
pre-commit = "^2.13.0"

# Apache-2.0 section 4(d) requires redistributed copies to carry the NOTICE
# attributions, so both files are recorded in the built distribution metadata.
[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    # Build against numpy 2.x headers: the resulting C extension runs on both
    # numpy 1.26 and 2.x (numpy 2 headers are backward-compatible to 1.19+),
    # so a single wheel serves every supported runtime.
    "numpy>=2,<3",
    "tomli>=2.0.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
] 