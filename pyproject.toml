[project]
# PyPI distribution name. The import package remains ``habit`` (see packages).
# The literal name "HABIT" is prohibited on PyPI (admin block / name policy),
# so we publish as ``habitat-analysis``: pip install habitat-analysis
name = "habitat-analysis"
version = "1.0.2"
description = "Habitat Analysis: Biomedical Imaging Toolkit (HABIT)"
# PyPI long description must be English by default. Keep README.md (Chinese) in
# the repository and sdist for bilingual readers; language switcher links use
# absolute GitHub URLs because relative paths break on pypi.org.
readme = "README_en.md"
# HABIT supports CPython 3.10–3.14 (verified on Windows: full check suite on
# 3.10, install + smoke on 3.13/3.14). The optional ``radiomics`` extra
# (PyRadiomics) has no usable PyPI binaries for Windows on any supported
# Python — HABIT publishes self-built wheels via GitHub Releases; see
# docs/tutorial/installation.rst.
requires-python = ">=3.10,<3.15"
authors = [
    { name = "Li Chao", email = "lichao19870617@163.com" },
]
license = { text = "Apache-2.0" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# HABIT is a library first: runtime dependencies use compatible ranges so the
# package can coexist with other scientific-Python stacks (sklearn / MONAI /
# PyRadiomics pipelines). Exact pins belong to the distribution installers'
# lock files, never to this metadata. Only the core imaging + habitat + table
# path is required here; heavier or narrower workflows live in the extras
# below and fail with OptionalDependencyError when used without their extra.
dependencies = [
    # numpy 2.x is fully supported (verified: full check suite + golden tests
    # under numpy 2.2.6). Extensions built against numpy 2 headers also run on
    # numpy 1.26, so one build covers both generations.
    "numpy>=1.26,<3",
    "SimpleITK>=2.2,<3",
    "matplotlib>=3.8,<4",
    "scipy>=1.11,<2",
    "openpyxl>=3.1,<4",
    "pandas>=2.1,<3",
    "tqdm>=4.66,<5",
    "scikit-learn>=1.4,<2",
    "joblib>=1.3,<2",
    "scikit-image>=0.23,<0.27",
    "seaborn>=0.13,<1",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
    "chardet>=5.0,<8",
    "pydicom>=3.0,<4",
    "pydantic>=2.7,<3",
    "kneed>=0.8,<1",
    # pyarrow 22 is the first release shipping CPython 3.14 wheels; keep the
    # tested 15–21 range on 3.10–3.13 so existing installs stay untouched.
    "pyarrow>=15,<22; python_version < '3.14'",
    "pyarrow>=22,<23; python_version >= '3.14'",
]

[project.scripts]
habit = "habit.cli:cli"

# Plugin entry-point groups are intentionally NOT declared here: setuptools
# strips empty groups from the generated metadata, so empty declarations would
# be dead weight. Third-party plugins declare the groups in their own
# packaging metadata (e.g. [project.entry-points."habit.supervoxelizer"] or
# [project.entry-points."habit.combiner"] for a custom feature combiner) and
# `habit.load_plugins()` discovers them at run time. The authoritative group
# list lives in `habit/api/plugins.py::_ENTRY_POINT_GROUPS` and is documented
# in docs/source/api/plugins.rst.

[project.optional-dependencies]
# PyRadiomics is optional. PyPI ships NO usable Windows binaries for cp310+:
# the 3.1.0 sdist is broken (wrong static version 3.0.1a1 / versioneer
# metadata), and 3.0.1 has no Windows wheels either. HABIT publishes
# self-built 3.1.0 Windows wheels (cp310–cp314, numpy-2 compiled, verified on
# numpy 1.26 and 2.x) as GitHub Release assets. Preferred recipes:
#   Windows: pip install <released-wheel> then "habitat-analysis[radiomics]"
#   macOS/Linux: conda install -c conda-forge pyradiomics (when network works)
#   Windows conda-forge is optional only; mirror/repodata failures are common.
radiomics = [
    "pyradiomics>=3.0.1,<3.2",
]
gui = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
]
# Full tabular-ML workflow: gradient-boosted model, resampling, and the
# statistical feature selectors (stepwise / univariate-logistic / VIF / mRMR).
ml = [
    "xgboost>=2.1,<4",
    "imbalanced-learn>=0.12,<1",
    "mrmr-selection>=0.2.8,<1",
    "statsmodels>=0.14,<1",
]
# ANTs-based image registration backend for the preprocessing workflow.
registration = [
    "antspyx>=0.4.2,<1",
]
analysis = [
    "krippendorff>=0.8,<1",
    "shap>=0.45,<1",
    "plotly>=5.20,<7",
    # 0.5.4 is the oldest release exposing the ICC API HABIT calls, and the
    # verified Windows environment runs 0.5.5; do not raise this floor above
    # the version the installer locks.
    "pingouin>=0.5.4,<1",
    # Survival analysis: lifelines covers Kaplan-Meier, log-rank and CoxPH;
    # scikit-survival adds the sklearn-compatible estimators (random survival
    # forest, gradient boosting) and the C-index / Brier-score metrics.
    "lifelines>=0.28,<1",
    "scikit-survival>=0.23,<1",
]
automl = [
    "autogluon.tabular[lightgbm,catboost]>=1.2,<2",
]
# Convenience meta-extra: every optional workflow dependency at once.
all = [
    "pyradiomics>=3.0.1,<3.2",
    "xgboost>=2.1,<4",
    "imbalanced-learn>=0.12,<1",
    "mrmr-selection>=0.2.8,<1",
    "statsmodels>=0.14,<1",
    "antspyx>=0.4.2,<1",
    "krippendorff>=0.8,<1",
    "shap>=0.45,<1",
    "plotly>=5.20,<7",
    "pingouin>=0.5.4,<1",
    "lifelines>=0.28,<1",
    "scikit-survival>=0.23,<1",
    "autogluon.tabular[lightgbm,catboost]>=1.2,<2",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
]
# Torch is an optional backend in HABIT's Python API. Distribution installers
# select an exact CPU or CUDA pair from their platform locks; keeping only the
# supported API range here prevents the CUDA layer from violating wheel metadata.
torch = [
    "torch>=2.4,<3",
]

# Poetry remains able to identify the supported interpreter, but all runtime
# package requirements live exclusively in ``project.dependencies`` above.
[tool.poetry.dependencies]
python = ">=3.10,<3.15"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
black = "^21.5b2"
mypy = "^0.910"
pylint = "^2.9.0"
pre-commit = "^2.13.0"

# Apache-2.0 section 4(d) requires redistributed copies to carry the NOTICE
# attributions, so both files are recorded in the built distribution metadata.
[tool.setuptools]
license-files = ["LICENSE", "NOTICE"]

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    # Build against numpy 2.x headers: the resulting C extension runs on both
    # numpy 1.26 and 2.x (numpy 2 headers are backward-compatible to 1.19+),
    # so a single wheel serves every supported runtime.
    "numpy>=2,<3",
    "tomli>=2.0.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
] 