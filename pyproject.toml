[project]
name = "HABIT"
version = "0.1.0"
description = "Habitat Analysis: Biomedical Imaging Toolkit"
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Li Chao", email = "lichao19870617@163.com" },
]
dependencies = [
    "numpy==1.26.1",
    "SimpleITK==2.2.1",
    "antspyx==0.4.2",
    "imbalanced-learn==0.14.2",
    "matplotlib==3.10.9",
    "scipy==1.15.3",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "tqdm==4.68.1",
    "scikit-learn==1.7.2",
    "joblib==1.5.3",
    "scikit-image==0.25.2",
    "six==1.17.0",
    "mrmr-selection==0.2.8",
    "pingouin==0.6.1",
    "statsmodels==0.14.6",
    "xgboost==3.1.3",
    "seaborn==0.13.2",
    "PyYAML==6.0.3",
    "click==8.4.1",
    "chardet==7.4.3",
    "pydicom==3.0.2",
    "pydantic==2.13.4",
    "kneed==0.8.6",
    "pyarrow==20.0.0",
    "pyradiomics==3.0.1",
]

[project.scripts]
habit = "habit.cli:cli"

[project.optional-dependencies]
gui = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.22",
]
analysis = [
    "krippendorff==0.8.2",
    "shap==0.49.1",
    "plotly==6.8.0",
    "lifelines==0.30.0",
]
automl = [
    "autogluon.tabular[lightgbm,catboost]==1.5.0",
]
# Torch is an optional backend in HABIT's Python API. Distribution installers
# select an exact CPU or CUDA pair from their platform locks; keeping only the
# supported API range here prevents the CUDA layer from violating wheel metadata.
torch = [
    "torch>=2.4,<3",
]

# Poetry remains able to identify the supported interpreter, but all runtime
# package requirements live exclusively in ``project.dependencies`` above.
[tool.poetry.dependencies]
python = ">=3.10,<3.11"

[tool.poetry.group.dev.dependencies]
pytest = "^6.2.5"
black = "^21.5b2"
mypy = "^0.910"
pylint = "^2.9.0"
pre-commit = "^2.13.0"

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "numpy==1.26.1",
    "tomli>=2.0.1; python_version < '3.11'",
]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
follow_imports = "skip"
ignore_missing_imports = true

[tool.pylint.messages_control]
disable = [
    "C0111",  # missing-docstring
    "C0103",  # invalid-name
    "R0903",  # too-few-public-methods
] 