# Exact network-resolved runtime layer for Windows CPython 3.10.20.
# PyRadiomics and the HABIT wheel are deliberately absent: the installer must
# verify and install those artifacts from the offline vendor bundle.
#
# The Windows bundle ships ONE fully working environment, so this lock is
# deliberately wider than pyproject.toml's required set: since 1.1.0 the
# packages below marked "optional extra" are not installed by a bare
# ``pip install habitat-analysis``, but the portable ZIP still contains them
# because its users expect every workflow to run out of the box.
#
# Versions are pinned to the environment the test suite actually passed on
# (numpy 1.26.1 / pandas 2.2.3 / scikit-learn 1.6.1 / joblib 1.5.1), NOT to
# the newest release the resolver would pick. This is the project's
# environment-drift lock: pyproject.toml declares compatible RANGES, this
# file pins the verified combination. Regenerate it from `pip freeze` of a
# green environment, keeping only the HABIT runtime set below.
--index-url https://pypi.tuna.tsinghua.edu.cn/simple
--extra-index-url https://download.pytorch.org/whl/cpu

