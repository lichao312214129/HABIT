# =============================================================================
# HABIT v1 configuration document — interleaved table pipeline (steps)
#
# 中文：本文件演示 v1 原生写法的 `spec.steps`：一个有序列表，列表顺序就是执行
#      顺序，预处理器与特征筛选器可以任意交错。旧的三段式写法
#      （pre_preprocessing_feature_selectors / table_preprocessors /
#      feature_selectors）在整个 v1.x 仍然可用，但它只有两个可选位置——全部
#      预处理之前、或全部预处理之后——因此 zscore → variance → minmax → lasso
#      这样的顺序根本写不出来。本文件写的正是这种顺序。
#
# EN: This document demonstrates the native v1 `spec.steps` layout: ONE ordered
#     list whose order IS the execution order, so table preprocessors and
#     feature selectors interleave freely. The three deprecated chain fields
#     stay available for all of v1.x, but they express order through three
#     fixed slots and therefore cannot represent an order such as
#     zscore -> variance -> minmax -> lasso. That is exactly what this file
#     declares.
#
# 运行 / Run (v1 documents are executed through the Python API):
#
#   python -c "import habit; habit.recipes.run_from_yaml('config/machine_learning/config_machine_learning_steps_v1.yaml', workflow='cv', save=True)"
#
# PATH SEMANTICS: v1 documents use paths as written — run from the repository
# root, or use absolute paths. (v0 configs resolve relative to the YAML file.)
# =============================================================================

version: '1.0'
workflow: cv
mode: train

# --- What to compute (mirrors habit.MLSpec field for field) ------------------
spec:
  name: ml_cv
  # 有序步骤链 / The ordered step chain.
  #
  # 每一项的 name 在两个注册表里解析：TablePreprocessorRegistry（zscore /
  # minmax / robust / binning / winsorize / log / variance_filter /
  # correlation_filter）与 FeatureSelectorRegistry（variance / correlation /
  # vif / anova / chi2 / lasso / stepwise / rfecv / mrmr / icc / ...）。两个
  # 词表互不重名，因此只写名字就能唯一确定组件。
  #
  # EN: Each `name` resolves across both registries; the two vocabularies are
  # disjoint, so the name alone identifies the component. Position matters
  # scientifically: `variance` sits BEFORE `zscore` here because z-scoring
  # makes every feature variance 1.0, which would render variance-based
  # selection vacuous.
  steps:
    # 1) 先在原始尺度上做方差筛选：z-score 之后所有方差都变成 1.0。
    #    Variance selection on the RAW scale.
    - name: variance
      params:
        top_k: 20
    # 2) 标准化到零均值单位方差，供后面的正则化模型使用。
    #    Scale to zero mean / unit variance for the regularised model below.
    - name: zscore
      params: {}
    # 3) 在标准化后的尺度上剪掉冗余的强相关特征。
    #    Prune collinear features on the scaled matrix.
    - name: correlation
      params:
        threshold: 0.80
        method: spearman
    # 4) 再压到 [0, 1]:这一步在旧的三段式写法里无法表达,因为它位于两个
    #    筛选步骤之间。
    #    A SECOND preprocessor, sitting between two selectors — the ordering
    #    the three deprecated slots cannot express at all.
    - name: minmax
      params: {}
    # 5) 最后用 L1 正则化做一次监督筛选。
    #    Final supervised selection.
    - name: lasso
      params:
        cv: 5
  # 终端分类器 / The terminal classifier.
  classifier:
    name: LogisticRegression
    params:
      C: 1.0
      penalty: l2
      solver: lbfgs
      max_iter: 1000
  # 空面板 = 由 recipe 提供默认指标 / An empty panel asks the recipe for its
  # default metric set.
  metrics: []
  # 每个随机组件都用这一个种子 / One seed for every stochastic component; it is
  # part of the spec fingerprint.
  random_seed: 42

# --- Where the feature table lives ------------------------------------------
data:
  input:
    - path: demo_data/ml_data/breast_cancer_dataset.csv
      name: radiomics_
      subject_id_col: subject_id
      label_col: label

# --- Validation design (a recipe choice, deliberately NOT part of the spec) --
legacy:
  n_splits: 5

# --- What to persist ---------------------------------------------------------
output:
  out_dir: demo_data/results/ml/steps_v1
  is_save_model: false
