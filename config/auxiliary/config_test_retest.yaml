# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit icc -c <配置文件.yaml> 或 habit retest -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 重测复现性 / 生境标签映射 DEMO —— Test-Retest habitat label mapping
#
# 运行方式 / How to run (Windows: Anaconda Prompt 或 PowerShell):
#   conda activate py310         # 激活装有 HABIT 的环境（本机环境名为 py310）
#   cd F:\work\habit_project      # 进入项目根目录
#   habit retest -c config/auxiliary/config_test_retest.yaml
#
# 背景 / Why:
#   两次聚类得到的生境标签（label 1/2/3...）因聚类随机性可能对不上号。
#   本工具用“各生境的特征中位数相似度”把 retest 的标签映射回 test 的标签，
#   再把 retest 的生境图(NRRD)按映射重标注，保证后续 ICC/复现性分析标签一致。
#
# 前置条件 / Prerequisite:
#   需先跑二步法生境训练，产出 habitats.parquet 与 *_habitats.nrrd：
#   habit get-habitat -c config/habitat/config_habitat_two_step.yaml -m train
#
# 本 DEMO 说明 / Note:
#   为便于演示，test 与 retest 用同一张特征表（identity 映射的冒烟测试）。
#   真实项目里请分别填两次扫描各自的 habitat 特征表与 retest 的 NRRD 目录。
#
# 路径约定 / Path convention:
#   相对路径相对“本 YAML 文件所在目录”解析，../../demo_data/... 即仓库 demo_data/。

# 输出目录：保存重标注后的 NRRD 与日志（自动创建）

# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
out_dir: ../../demo_data/results/test_retest/remapped

# test 组生境特征表（含 'habitats' 列，支持 .parquet/.csv/.xlsx）
# 中文：★【必须修改】test 扫描的生境特征表（CSV、Excel 或 Parquet）。
# EN: ★ MUST EDIT: Habitat feature table from the test scan (CSV, Excel or Parquet).
test_habitat_table: ../../demo_data/results/habitat_two_step/habitats.parquet
# retest 组生境特征表（本 DEMO 用同一张 → identity 映射）
# 中文：★【必须修改】retest 扫描的生境特征表；真实研究不可与 test 使用同一文件。
# EN: ★ MUST EDIT: Habitat feature table from the retest scan; do not reuse the test file in real studies.
retest_habitat_table: ../../demo_data/results/habitat_two_step/habitats.parquet

# 用于相似度计算的特征列；null = 自动用第 4 列到倒数第 2 列
# 中文：特征列限制；留空/null 通常表示自动使用可用特征，指定列表时必须与表头一致。
# EN: Feature-column restriction; empty/null usually auto-selects available features; named columns must match headers.
features: null
# 相似度方法：pearson / spearman / kendall / euclidean / cosine / manhattan / chebyshev
similarity_method: pearson

# 含 retest 生境图的目录（匹配 *habitats.nrrd）；本 DEMO 直接用训练输出目录
# 中文：★【必须修改】待重标注 retest 生境图的目录，通常包含 *_habitats.nrrd。
# EN: ★ MUST EDIT: Folder of retest habitat maps to relabel, usually containing *_habitats.nrrd.
input_dir: ../../demo_data/results/habitat_two_step

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
processes: 2      # 并行进程数
# 中文：调试日志开关；常规运行保持 false，排查报错时才改为 true。
# EN: Debug logging switch; keep false in normal runs and enable only when troubleshooting.
debug: false      # 是否输出调试日志
# =============================================================================
