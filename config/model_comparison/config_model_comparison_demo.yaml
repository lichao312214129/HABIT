delong_test:
  # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
  # EN: Feature switch; false skips this module and true uses its nested settings.
  enabled: true
  save_name: delong_results.json
metrics:
  # 中文：`basic_metrics` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `basic_metrics` is a setting for this module; retain the example default initially and document any change.

  # --- 2.5 basic_metrics ---
  basic_metrics:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true

  # --- 2.6 youden_metrics ---
  youden_metrics:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true

  # --- 2.7 target_metrics ---
  target_metrics:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true
    targets:
      sensitivity: 0.91
      # 中文：目标特异度；用于计算特定临床阈值下的指标。
      # EN: Target specificity used to calculate metrics at a specified clinical operating point.
      specificity: 0.91
