# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit compare -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 中文：比较多个模型的预测结果（ROC/DCA/校准/DeLong 等）。
# EN:   Compare multiple model prediction CSVs (plots + statistics).
#
# 运行 / Run:
#   habit compare -c config/model_comparison/config_model_comparison_demo.yaml
#
# 【你只需要改标了 ★ 的项】
#   ★ 1. output_dir
#   ★ 2. files_config 里每个模型的 path 与列名
#
# 【YAML 注意】
#   - 空格缩进；冒号后有空格；true/false 小写
#   - 路径一般不用引号；仅含空格或特殊字符时加引号，如 "D:/my data/pred.csv"
#   - 相对路径相对本 YAML 目录解析

# ★ 比较结果输出目录

# 中文：★【必须修改】比较结果的输出目录；图表和统计文件保存在这里。
# EN: ★ MUST EDIT: Output directory for comparison plots and statistics.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
output_dir: ../../demo_data/results/model_comparison

# ★ 每个模型一份预测 CSV；model_name 必须互不相同

# 中文：★【必须修改】待比较模型的预测 CSV 列表；每个模型都必须有唯一名称和正确列映射。
# EN: ★ MUST EDIT: Prediction CSVs to compare; each model needs a unique name and correct column mapping.
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
files_config:
  # 中文：★【必须修改】文件或目录路径；相对路径以本 YAML 所在文件夹为起点解析。
  # EN: ★ MUST EDIT: File or directory path; relative paths resolve from this YAML file.
  - path: ../../demo_data/results/ml/radiomics/all_prediction_results.csv
    model_name: radiomics                 # 图例中显示的名称
    # 中文：★【必须修改】CSV 中唯一受试者 ID 的列名；必须与实际表头完全一致。
    # EN: ★ MUST EDIT: Unique subject-ID column in the CSV; must exactly match its header.
    subject_id_col: subject_id            # 受试者 ID 列
    # 中文：★【必须修改】真实结局/标签列名；二分类通常使用 0 和 1。
    # EN: ★ MUST EDIT: True outcome/label column; binary classification normally uses 0 and 1.
    label_col: label                      # 真实标签列（0/1）
    # 中文：★【必须修改】预测概率列名；更换模型后通常需要同步修改。
    # EN: ★ MUST EDIT: Predicted-probability column; update it after changing models.
    prob_col: LogisticRegression_prob     # 预测概率列（0–1）
    # 中文：★【必须修改】预测类别列名；必须与预测 CSV 的实际表头一致。
    # EN: ★ MUST EDIT: Predicted-class column; must match the prediction CSV header.
    pred_col: LogisticRegression_pred     # 预测类别列（0/1）
    # 中文：★【必须修改】数据集划分列名（如 train/test）；按上游预测 CSV 的实际列名填写。
    # EN: ★ MUST EDIT: Dataset-split column (for example train/test); match the upstream CSV.
    split_col: dataset                    # 划分列（如 train/test）
  # 中文：★【必须修改】文件或目录路径；相对路径以本 YAML 所在文件夹为起点解析。
  # EN: ★ MUST EDIT: File or directory path; relative paths resolve from this YAML file.
  - path: ../../demo_data/results/ml/clinical/all_prediction_results.csv
    model_name: clinical
    # 中文：★【必须修改】CSV 中唯一受试者 ID 的列名；必须与实际表头完全一致。
    # EN: ★ MUST EDIT: Unique subject-ID column in the CSV; must exactly match its header.
    subject_id_col: subject_id
    # 中文：★【必须修改】真实结局/标签列名；二分类通常使用 0 和 1。
    # EN: ★ MUST EDIT: True outcome/label column; binary classification normally uses 0 and 1.
    label_col: label
    # 中文：★【必须修改】预测概率列名；更换模型后通常需要同步修改。
    # EN: ★ MUST EDIT: Predicted-probability column; update it after changing models.
    prob_col: LogisticRegression_prob
    # 中文：★【必须修改】预测类别列名；必须与预测 CSV 的实际表头一致。
    # EN: ★ MUST EDIT: Predicted-class column; must match the prediction CSV header.
    pred_col: LogisticRegression_pred
    # 中文：★【必须修改】数据集划分列名（如 train/test）；按上游预测 CSV 的实际列名填写。
    # EN: ★ MUST EDIT: Dataset-split column (for example train/test); match the upstream CSV.
    split_col: dataset
  # 第三个模型示例:
  # - path: ../../demo_data/results/ml/other/all_prediction_results.csv
  #   model_name: combined
  #   subject_id_col: subject_id
  #   label_col: label
  #   prob_col: LogisticRegression_prob
  #   pred_col: LogisticRegression_pred
  #   split_col: dataset

# 中文：`merged_data` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `merged_data` is a setting for this module; retain the example default initially and document any change.
merged_data:
  # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
  # EN: Feature switch; false skips this module and true uses its nested settings.
  enabled: true
  save_name: combined_predictions.csv

# 是否按 train/test 等划分分别出图
# 中文：`split` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `split` is a setting for this module; retain the example default initially and document any change.
split:
  # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
  # EN: Feature switch; false skips this module and true uses its nested settings.
  enabled: true

# 中文：图形输出设置；图中的语言保持英文，便于论文与跨团队交流。
# EN: Plot-output settings; plot text remains English for publication and cross-team use.
visualization:
  # --- 2.1 roc ---
  roc:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true
    save_name: roc_curves.pdf
    title: ROC Curves
  # 中文：`dca` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `dca` is a setting for this module; retain the example default initially and document any change.

  # --- 2.2 dca ---
  dca:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true
    save_name: decision_curves.pdf
    title: Decision Curves
  # 中文：`calibration` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `calibration` is a setting for this module; retain the example default initially and document any change.

  # --- 2.3 calibration ---
  calibration:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true
    save_name: calibration_curves.pdf
    n_bins: 5
    # 中文：图标题；请保持英文以符合软件统一绘图和论文图表规范。
    # EN: Plot title; keep English to follow the software and publication figure convention.
    title: Calibration Curves
  # 中文：`pr_curve` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `pr_curve` is a setting for this module; retain the example default initially and document any change.

  # --- 2.4 pr_curve ---
  pr_curve:
    # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
    # EN: Feature switch; false skips this module and true uses its nested settings.
    enabled: true
    save_name: precision_recall_curves.pdf
    title: Precision-Recall Curves

# 中文：`delong_test` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
