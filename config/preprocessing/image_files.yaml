# =============================================================================
# 通用清单模板 —— 自定义多模态影像路径（占位示例，非可直接运行）
# Generic manifest template — author your own multi-modality paths (PLACEHOLDER)
# =============================================================================
#
# 用途 / Purpose:
#   这是给你“照着改”的通用模板：把下面的占位路径 /path/to/... 换成你自己的
#   真实文件（.nii/.nii.gz）或 DICOM 文件夹路径即可。模态键（T1/T2/DWI/ADC…）
#   随你的数据自定义，但必须与预处理 YAML 里 `images:` 用到的键一致。
#
# 想直接运行的 DEMO 请改用（都指向随包的 demo_data）：
#   - files_preprocessing.yaml     —— DICOM(delay2/3/5) 转 NIfTI 的 demo 清单
#   - file_habitat.yaml            —— get-habitat 用的 demo 清单（images+masks）
#
# 路径约定 / Path convention:
#   相对路径（../, ../../）相对“本 YAML 文件所在目录”解析。
# =============================================================================
auto_select_first_file: true
images:
  subjectA:
    T1:  /path/to/subjectA/T1.nii.gz
    T2:  /path/to/subjectA/T2.nii.gz
    DWI: /path/to/subjectA/DWI.nii.gz
    ADC: /path/to/subjectA/ADC.nii.gz
  subjectB:
    T1:  /path/to/subjectB/T1.nii.gz
    T2:  /path/to/subjectB/T2.nii.gz
    DWI: /path/to/subjectB/DWI.nii.gz
    ADC: /path/to/subjectB/ADC.nii.gz
masks:
  subjectA:
    T1:  /path/to/subjectA/T1_mask.nii.gz
    T2:  /path/to/subjectA/T2_mask.nii.gz
  subjectB:
    T1:  /path/to/subjectB/T1_mask.nii.gz
    T2:  /path/to/subjectB/T2_mask.nii.gz
