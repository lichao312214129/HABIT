# =============================================================================
# 0. 文件说明 / Overview
# 中文：这是输入数据清单。带 ★ 的受试者 ID、模态名和路径必须替换为真实数据，且键名必须与主配置一致。
# EN: This is an input manifest. Replace ★ subject IDs, modality names and paths with real data, keeping keys consistent with the main config.
#
# 运行 / Run: habit preprocess -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml> --syntax-only（清单/参数预设仅做 YAML 语法检查）

# 预处理清单 DEMO（DICOM 序列文件夹）—— demo_data/dicom
# Preprocessing manifest — DEMO (DICOM series folders, delay phases)
#
# 何时用到 / When is this used:
#   当某个预处理 YAML 的 data_dir 指向本文件时（例如
#   config_image_preprocessing_dcm2nii.yaml），dcm2nii 步骤会按下面的
#   “模态键 -> DICOM 序列文件夹”映射把 DICOM 转成 NIfTI。
#
# 结构 / Structure:
#   images:
#     <subject_id>:
#       <modality_key>: <该模态对应的 DICOM 序列文件夹>
#   模态键用 delay2 / delay3 / delay5（增强延迟 2/3/5 分钟），
#   必须与 Preprocessing.dcm2nii.images 里的键完全一致。
#
# 说明 / Note:
#   同一份 DICOM demo 清单也提供了 files_preprocessing_dcm2nii_demo.yaml，
#   二者内容等价；docs / skills 引用的规范名是本文件（files_preprocessing.yaml）。
#
# 路径约定 / Path convention:
#   相对路径（../, ../../）相对“本 YAML 文件所在目录”解析，
#   ../../demo_data/... 即仓库根目录下的 demo_data/。

# DICOM 序列文件夹里有多个切片文件，dcm2nii 需要整个文件夹，
# 因此保持 false（把文件夹整体交给 dcm2niix），不要自动只取第一个文件。
# 中文：同一受试者/模态有多个文件时是否自动选第一个；DICOM 文件夹输入通常应为 false。
# EN: Whether to select the first file when multiple exist per subject/modality; normally false for DICOM folders.
auto_select_first_file: false

# 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
# EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
images:
  # 中文：★【必须修改】受试者 ID；替换为真实唯一 ID，并确保 images 与 masks 两处一致。
  # EN: ★ MUST EDIT: Subject ID; replace with a real unique ID and match images/masks.
  # --- 1.1 sub001 ---
  sub001:
    # 中文：★【必须修改】该受试者该模态的文件或文件夹路径；模态键须与主配置一致。
    # EN: ★ MUST EDIT: File/folder path for this subject and modality; keep the modality key consistent.
    delay2: ../../demo_data/dicom/sub001/WATER_BHAxLAVA-Flex-2min_Series0012
    # 中文：★【必须修改】该受试者该模态的文件或文件夹路径；模态键须与主配置一致。
    # EN: ★ MUST EDIT: File/folder path for this subject and modality; keep the modality key consistent.
    delay3: ../../demo_data/dicom/sub001/WATER_BHAxLAVA-Flex-3min_Series0014
    # 中文：★【必须修改】该受试者该模态的文件或文件夹路径；模态键须与主配置一致。
    # EN: ★ MUST EDIT: File/folder path for this subject and modality; keep the modality key consistent.
    delay5: ../../demo_data/dicom/sub001/WATER_BHAxLAVA-Flex-5min_Series0016
  # 中文：★【必须修改】受试者 ID；替换为真实唯一 ID，并确保 images 与 masks 两处一致。
  # EN: ★ MUST EDIT: Subject ID; replace with a real unique ID and match images/masks.

  # --- 1.2 sub002 ---
  sub002:
    # 中文：★【必须修改】该受试者该模态的文件或文件夹路径；模态键须与主配置一致。
    # EN: ★ MUST EDIT: File/folder path for this subject and modality; keep the modality key consistent.
    delay2: ../../demo_data/dicom/sub002/013_WATERBHAxLAVAFlex2min
    # 中文：★【必须修改】该受试者该模态的文件或文件夹路径；模态键须与主配置一致。
    # EN: ★ MUST EDIT: File/folder path for this subject and modality; keep the modality key consistent.
    delay3: ../../demo_data/dicom/sub002/015_WATERBHAxLAVAFlex3min
    # 中文：★【必须修改】该受试者该模态的文件或文件夹路径；模态键须与主配置一致。
    # EN: ★ MUST EDIT: File/folder path for this subject and modality; keep the modality key consistent.
    delay5: ../../demo_data/dicom/sub002/016_WATERWATERBHAxLAVAFlex5min
# =============================================================================
