# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit preprocess -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 影像预处理 DEMO —— N4 偏置场校正 + 重采样 + 配准 (elastix)
# Image preprocessing DEMO — N4 bias correction + resample + registration (elastix)
#
# 运行方式 / How to run (Windows: Anaconda Prompt 或 PowerShell):
#   conda activate py310         # 激活装有 HABIT 的环境（本机环境名为 py310）
#   cd F:\work\habit_project      # 进入项目根目录
#   habit preprocess -c config/preprocessing/config_preprocessing_n4_resample_registration.yaml
#
# 作用 / What it does (按顺序执行):
#   1) n4_correction  : MRI 偏置场（亮度不均）校正
#   2) resample       : 统一体素间距
#   3) registration   : 用 elastix 把其它模态配准到参考模态 (delay2)
#
# External tools:
#   tools/bin/elastix.exe and tools/bin/transformix.exe are included with the release package.
#   demo_data/Par0040affine.txt is the demo registration parameter file.
#
# 输入 / Input : demo_data/preprocessed/processed_images（模态键 delay2/delay3/delay5）
# 路径约定     : 相对路径相对“本 YAML 文件所在目录”解析，../../demo_data/... 即仓库 demo_data/。

# 【必改】输入 / 输出路径

# 中文：★【必须修改】输入数据根目录；填写文件夹或指定的清单 YAML，不要填写单个影像文件。
# EN: ★ MUST EDIT: Input root directory or manifest YAML; do not enter one image file.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
data_dir: ../../demo_data/preprocessed/processed_images                       # 输入根目录（含 images/ 与 masks/）
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: ../../demo_data/results/preprocessing_n4_resample_registration       # 输出目录（自动创建）
auto_select_first_file: true

# 中文：预处理步骤；书写顺序就是执行顺序，首次使用请按示例保留。
# EN: Preprocessing steps; their YAML order is the execution order. Keep the example initially.
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
preprocessing:
  # 1) N4 偏置场校正（仅 MRI 需要；CT 一般不用）
  # 中文：`n4_correction` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `n4_correction` is a setting for this module; retain the example default initially and document any change.
  # --- 2.1 n4_correction ---
  n4_correction:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [delay2, delay3, delay5]   # 要校正的模态键
    num_fitting_levels: 2              # 拟合层级数（2~4 常用，越大越慢）

  # 2) 重采样到统一间距
  # 中文：`resample` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `resample` is a setting for this module; retain the example default initially and document any change.

  # --- 2.2 resample ---
  resample:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [delay2, delay3, delay5]
    target_spacing: [3.0, 3.0, 3.0]    # 目标体素间距 [x, y, z]，mm

  # 3) 配准（elastix 后端）：把“非参考模态”对齐到参考模态
  # 中文：`registration` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `registration` is a setting for this module; retain the example default initially and document any change.

  # --- 2.3 registration ---
  registration:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [delay2, delay3, delay5]           # 参与配准的全部模态；移动图像 = images 去掉 fixed_image
    # 中文：★【必须检查】配准参考模态；必须是 images 列表中的一个有效模态键。
    # EN: ★ REVIEW: Registration reference modality; it must be a valid key in the images list.
    fixed_image: delay2                         # 参考模态（不动），其余向它对齐
    use_mask: true                              # 使用 mask 辅助配准（demo 数据带 mask）
    backend: elastix                            # 配准后端：ants / simpleitk / elastix
    # 中文：`elastix_path` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
    # EN: `elastix_path` is a setting for this module; retain the example default initially and document any change.
    elastix_path: ../../tools/bin               # elastix executable or its directory
    # 中文：`transformix_path` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
    # EN: `transformix_path` is a setting for this module; retain the example default initially and document any change.
    transformix_path: ../../tools/bin           # transformix executable or its directory
    # 中文：`elastix_parameter_files` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
    # EN: `elastix_parameter_files` is a setting for this module; retain the example default initially and document any change.
    elastix_parameter_files: ../../demo_data/Par0040affine.txt   # elastix 参数文件（仿射配准）
# =============================================================================

# =============================================================================
# 3. 高级设置（首次保持默认）/ Advanced (keep defaults initially)
# EN: Advanced settings
# 中文：`save_options` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `save_options` is a setting for this module; retain the example default initially and document any change.
save_options:
  # 中文：`save_intermediate` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `save_intermediate` is a setting for this module; retain the example default initially and document any change.
  save_intermediate: true                        # 保存每一步中间结果，便于检查
  # 中文：`intermediate_steps` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `intermediate_steps` is a setting for this module; retain the example default initially and document any change.
  intermediate_steps: [n4_correction, resample, registration]

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
processes: 1                                     # elastix 为外部进程，建议 1（避免并发占用过多资源）
# 中文：随机种子；保持固定可复现结果，除非研究设计明确要求改变。
# EN: Random seed; keep it fixed for reproducibility unless the study design requires otherwise.
random_state: 42
# =============================================================================
