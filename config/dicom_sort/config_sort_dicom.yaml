# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit sort-dicom -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# DICOM sort / rename — NOT used with resample_02 test data (NIfTI only)
#
# resample_02 (.cursor/test/resample_02) contains NIfTI, not DICOM.
# This config is kept for production DICOM workflows only.
# There is no resample_02-based test script for sort-dicom.
#
#   habit sort-dicom --config config/dicom_sort/config_sort_dicom.yaml
#
# Paths resolve relative to this YAML file. data_dir: DICOM root directory only.
# Path convention: relative paths (../, ../../) resolve from this YAML file's directory,
# not the shell cwd. Example: ../../demo_data/... => repository demo_data/.

# 中文：★【必须修改】输入数据根目录；填写文件夹或指定的清单 YAML，不要填写单个影像文件。
# EN: ★ MUST EDIT: Input root directory or manifest YAML; do not enter one image file.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
data_dir: ../../demo_data/dicom  # DICOM root directory
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: ../../demo_data/results/sorted_dicom  # Output directory
# 中文：★【必须修改】dcm2niix 可执行文件路径；Windows 通常以 .exe 结尾。
# EN: ★ MUST EDIT: dcm2niix executable path; on Windows it normally ends in .exe.
dcm2niix_path: ../../tools/bin/dcm2niix.exe  # dcm2niix executable path
f: "subj_%n_%g_%x/%s_%d/%r_%o.dcm"  # dcm2niix -f pattern
extra_args: []  # extra arguments for dcm2niix
# =============================================================================
