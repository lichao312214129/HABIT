# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit extract -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# Path convention: relative paths (../, ../../) resolve from this YAML file's directory,
# not the shell cwd. Example: ../../demo_data/... => repository demo_data/.
# Path convention: relative paths (../, ../../) resolve from this YAML file's directory,
# not the shell cwd. Example: ../../demo_data/... => repository demo_data/.
# Habitat Feature Extraction Configuration Template
#
# Used by:  habit extract  (entry: habit/commands/cmd_extract_features.py)
#
# Quick Start:
#   CLI:    habit extract --config config/feature_extraction/config_extract_features.yaml
#
# Role:
#   Production template: set `raw_img_folder`, `habitats_map_folder`, `out_dir`,
#   PyRadiomics params, and `feature_types` for your cohort.
#
# NOT overlapping with:
#   config_extract_features_demo.yaml — demo paths under ../../demo_data/...
# PyRadiomics Parameter Files
# Parameter file for traditional radiomics from original images
# Optional: omit both lines to use bundled presets (roi + habitat under habit/resources/radiomics/)
# params_file_of_non_habitat: ../radiomics/parameter.yaml
# Parameter file for radiomics from habitat maps
# params_file_of_habitat: ../radiomics/parameter_habitat.yaml
# Data Directories
# Root directory containing original images
# Expected structure: raw_img_folder/subject_id/images/ and masks/

# 中文：★【必须修改】原始或预处理影像根目录，供生境特征提取使用。
# EN: ★ MUST EDIT: Root of raw/preprocessed images for habitat feature extraction.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
raw_img_folder: H:\Registration_ICC_structured
# Root directory containing habitat maps
# Expected structure: habitats_map_folder/subject_id/*_habitats.nrrd
# 中文：★【必须修改】生境分割输出目录，内应有 *_habitats.nrrd 文件。
# EN: ★ MUST EDIT: Habitat output folder containing *_habitats.nrrd files.
habitats_map_folder: H:\results_icc
# Output directory for extracted features
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: H:\\results_icc_remapping
# Feature Extraction Parameters
# Number of parallel processes

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
n_processes: 3
# Pattern for matching habitat files
# Uses glob pattern
# 中文：`habitat_pattern` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `habitat_pattern` is a setting for this module; retain the example default initially and document any change.
habitat_pattern: '*_habitats_remapped.nrrd'
# Feature types to extract
# Options: traditional, non_radiomics, whole_habitat, each_habitat, msi, ith_score
# 中文：`feature_types` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `feature_types` is a setting for this module; retain the example default initially and document any change.
feature_types:
- traditional
- non_radiomics
- whole_habitat
- msi
- ith_score
# 中文：`n_habitats` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `n_habitats` is a setting for this module; retain the example default initially and document any change.
n_habitats:
# Debug mode
# 中文：调试日志开关；常规运行保持 false，排查报错时才改为 true。
# EN: Debug logging switch; keep false in normal runs and enable only when troubleshooting.
debug: false
# Output Files Generated
#
# Based on feature_types selected:
# - raw_image_radiomics.csv (traditional)
# - habitat_basic_features.csv (non_radiomics)
# - whole_habitat_radiomics.csv (whole_habitat)
# - habitat_{k}_radiomics.csv + habitat_count.csv (each_habitat)
# - msi_features.csv (msi)
# - ith_scores.csv (ith_score)
#
# =============================================================================
