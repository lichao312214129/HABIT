# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit extract -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 中文：基于生境图 + 原始影像，提取多种生境级特征表，供后续机器学习。
# EN:   Extract habitat-level feature tables from habitat maps + raw images.
#
# 运行 / Run:
#   habit extract -c config/feature_extraction/config_extract_features_demo.yaml
#
# 前置 / Prerequisite:
#   先跑生境分割生成 *_habitats.nrrd，例如：
#   habit get-habitat -c config/habitat/config_habitat_two_step.yaml
#
# 【你只需要改标了 ★ 的项】
#   ★ 1. raw_img_folder / habitats_map_folder / out_dir
#   ★ 2.（可选）feature_types 列表
#
# 【YAML 注意】空格缩进；路径一般不用引号（有空格时才加，如 "D:/my data"）

# ★ 原始/预处理影像根目录（含 images/）

# 中文：★【必须修改】原始或预处理影像根目录，供生境特征提取使用。
# EN: ★ MUST EDIT: Root of raw/preprocessed images for habitat feature extraction.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
raw_img_folder: ../../demo_data/preprocessed
# ★ 生境图目录（get-habitat 的 out_dir，内含 *_habitats.nrrd）
# 中文：★【必须修改】生境分割输出目录，内应有 *_habitats.nrrd 文件。
# EN: ★ MUST EDIT: Habitat output folder containing *_habitats.nrrd files.
habitats_map_folder: ../../demo_data/results/habitat_two_step
# ★ 特征输出目录
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: ../../demo_data/results/features

# params_file 可省略：省略则用内置 roi + habitat 预设
# params_file_of_non_habitat: ../radiomics/parameter.yaml
# params_file_of_habitat: ../radiomics/parameter_habitat.yaml

# ⚠ 并行进程数：过大可能内存不足

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
n_processes: 2
# 生境图文件名匹配模式（一般勿改）
habitat_pattern: '*_habitats.nrrd'

# Default feature_types: all light families (fast demo / first run).
# 中文：默认开启全部轻量特征（volume / msi / ith_score / non_radiomics）。
# EN: Defaults enable every light family; uncomment heavy radiomics when needed.
#
# Available names:
#   volume        : voxel counts / volume fractions per habitat (light)
#   msi           : multiregional spatial interaction (light)
#   ith_score     : intratumoral heterogeneity score (light)
#   non_radiomics : region count / volume ratio (light)
#   traditional   : PyRadiomics on raw image within whole ROI (heavy — opt-in)
#   whole_habitat : PyRadiomics on the habitat label map (heavy — opt-in)
#   each_habitat  : per-habitat PyRadiomics on raw image (heavy — opt-in)
feature_types:
  - volume
  - msi
  - ith_score
  - non_radiomics
  # --- Opt-in heavy radiomics (uncomment as needed) ---
  # - traditional
  # - whole_habitat
  # - each_habitat

# Optional radiomics compute backend (does NOT change bin width / feature classes).
# Supervoxel native cext is configured under get-habitat (feature_construction),
# not here. For habitat-level traditional/whole/each radiomics:
# use_torch_radiomics: false   # default: CPU PyRadiomics
# use_torch_radiomics: auto    # torch when CUDA is available
# use_torch_radiomics: true
# torch_device: auto
# torch_dtype: float32

# 生境个数；留空/null 表示自动检测
# 中文：`n_habitats` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `n_habitats` is a setting for this module; retain the example default initially and document any change.
n_habitats:

# 中文：调试日志开关；常规运行保持 false，排查报错时才改为 true。
# EN: Debug logging switch; keep false in normal runs and enable only when troubleshooting.
debug: false
# =============================================================================
