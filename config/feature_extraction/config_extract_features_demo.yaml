# =============================================================================
# 生境特征提取 DEMO —— Habitat feature extraction (多种特征类型)
# =============================================================================
# 运行方式 / How to run (Windows: Anaconda Prompt 或 PowerShell):
#   conda activate py310         # 激活装有 HABIT 的环境（本机环境名为 py310）
#   cd F:\work\habit_project      # 进入项目根目录
#   habit extract -c config/feature_extraction/config_extract_features_demo.yaml
#
# 前置条件 / Prerequisite:
#   需先跑生境分割生成 *_habitats.nrrd（见 habitats_map_folder 指向的目录）：
#   habit get-habitat -c config/habitat/config_habitat_two_step.yaml -m train
#
# 作用 / What it does:
#   基于生境图(habitat map)与原始影像，提取多种“生境级”特征表，供后续机器学习。
#
# 路径约定 / Path convention:
#   相对路径相对“本 YAML 文件所在目录”解析，../../demo_data/... 即仓库 demo_data/。
# =============================================================================
#%%================================================================================
raw_img_folder: ../../demo_data/preprocessed/processed_images
habitats_map_folder: ../../demo_data/results/habitat_two_step
out_dir: ../../demo_data/results/features
#%%================================================================================
# params_file optional: omit both lines to use bundled presets (roi + habitat)
# params_file_of_non_habitat: ../radiomics/parameter.yaml
# params_file_of_habitat: ../radiomics/parameter_habitat.yaml
n_processes: 2
habitat_pattern: '*_habitats.nrrd'
# 要提取的特征类型（本公开版可用）：
#   traditional   : 原始影像上、肿瘤 ROI（由生境图二值化）的传统 PyRadiomics
#   non_radiomics : 非组学形态特征（体积占比、连通域数量等）
#   whole_habitat : 在生境 label 图上做 PyRadiomics（强度=标签 ID）
#   each_habitat  : 每个生境标签在原始影像上的 PyRadiomics（habitat_{k}_radiomics.csv）
#   msi           : 多区域空间相互作用 (MSI) 矩阵特征
#   ith_score     : 瘤内异质性 (ITH) 评分
feature_types:
  - traditional
  - non_radiomics
  - whole_habitat
  - each_habitat
  - msi
  - ith_score
n_habitats:

debug: false
