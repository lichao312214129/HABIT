# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit extract -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 0. 最小可运行配置 / Minimal — 生境特征提取
# 完整说明见 config_extract_features_demo.yaml
# 运行: habit extract -c config/feature_extraction/config_extract_features_minimal.yaml
# 前置: 先完成 get-habitat
#
# 【YAML】路径一般不用引号；有空格时才加

# 中文：★【必须修改】原始或预处理影像根目录，供生境特征提取使用。
# EN: ★ MUST EDIT: Root of raw/preprocessed images for habitat feature extraction.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
raw_img_folder: ../../demo_data/preprocessed      # ★ 影像
# 中文：★【必须修改】生境分割输出目录，内应有 *_habitats.nrrd 文件。
# EN: ★ MUST EDIT: Habitat output folder containing *_habitats.nrrd files.
habitats_map_folder: ../../demo_data/results/habitat_two_step      # ★ 生境图
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: ../../demo_data/results/features                          # ★ 输出

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
n_processes: 2
habitat_pattern: '*_habitats.nrrd'
# Default: all light families (including graph). Uncomment heavy radiomics when needed.
# See config_extract_features_demo.yaml for traditional / whole_habitat / each_habitat
# and optional use_torch_radiomics (cext is a get-habitat supervoxel setting).
feature_types:
  - volume
  - msi
  - ith_score
  - non_radiomics
  - graph
  # - traditional
  # - whole_habitat
  # - each_habitat
# 中文：`n_habitats` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `n_habitats` is a setting for this module; retain the example default initially and document any change.
n_habitats:
# =============================================================================
