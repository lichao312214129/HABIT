# =============================================================================
# 0. 文件说明 / Overview
# 中文：这是研究方案级的 PyRadiomics 参数预设。带 ★ 的模块需要在分析开始前确认；同一研究中不要随意更改。
# EN: This is a study-level PyRadiomics preset. Confirm ★ sections before analysis; do not change them ad hoc within one study.
#
# 运行 / Run: habit radiomics -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml> --syntax-only（清单/参数预设仅做 YAML 语法检查）

# This is an example of settings that can be used as a starting point for analyzing MR data with small (~3mm) slice
# thickness. This is only intended as a starting point and is not likely to be the optimal settings for your dataset.
#
# NOTE (habit supervoxel_radiomics): supervoxel_batch, supervoxel_union_bbox_crop,
# use_supervoxel_cext, use_torch_radiomics, torchGpus, etc. belong in
# feature_construction.supervoxel_level.params (or inherit from voxel_level.params), NOT in this file.
# Habit discretizes once on the union supervoxel mask, then extracts ROI texture per label via PyRadiomics cMatrices.
# Some points in determining better values are added as comments where appropriate
# When adapting and using these settings for an analysis, be sure to add the PyRadiomics version used to allow you to
# easily recreate your extraction at a later timepoint:
# #############################  Extracted using PyRadiomics version: <version>  ######################################

# 中文：★【按研究方案确认】影像滤波类型；新增滤波会显著增加特征数量与多重比较负担。
# EN: ★ STUDY-DESIGN REVIEW: Image filters; adding filters increases feature count and multiplicity burden.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
imageType:
  # 中文：原始影像特征；不做额外滤波，通常是最基本且建议保留的特征来源。
  # EN: Original-image features without extra filtering; usually the fundamental source to retain.
  Original: {}
  # LoG:
  #   # If you include sigma values >5, remember to also increase the padDistance. Because of resampling to (2, 2, 2), the
  #   # use of sigmas < 2 mm is not recommended.
    # sigma: [2.0, 3.0, 4.0, 5.0]
  # Wavelet: {}
  # Square: {}
  # SquareRoot: {}
  # Logarithm: {}
  # Exponential: {}
  # Gradient: {}
  # LBP3D: {}

# 中文：★【按研究方案确认】要计算的特征类别；应在建模前固定，不要按结果反复调整。
# EN: ★ STUDY-DESIGN REVIEW: Feature classes; fix these before modelling rather than tuning to results.
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
featureClass:
  # redundant Compactness 1, Compactness 2 an Spherical Disproportion features are disabled by default, they can be
  # enabled by specifying individual feature names (as is done for glcm) and including them in the list.
  # shape:
  # 中文：一阶强度统计特征；描述灰度分布，不包含空间纹理关系。
  # EN: First-order intensity statistics; describe intensity distributions without spatial texture relationships.
  firstorder:
  # 中文：灰度共生矩阵纹理特征；描述相邻体素灰度组合，对离散化设置敏感。
  # EN: GLCM texture features; describe neighboring intensity combinations and depend on discretization.
  glcm:                             # List stable GLCM features only (avoid MCC/Imc1/Imc2 — crash on small ROIs)
  # 中文：灰度游程长度矩阵纹理特征；描述同灰度连续体素的游程。
  # EN: GLRLM texture features; describe runs of consecutive voxels with the same intensity.
  glrlm:
  # 中文：灰度大小区域矩阵纹理特征；描述同灰度连通区域大小。
  # EN: GLSZM texture features; describe sizes of connected same-intensity zones.
  glszm:
  # 中文：邻域灰度差矩阵纹理特征；描述体素与邻域灰度的差异。
  # EN: NGTDM texture features; describe intensity differences between voxels and their neighborhoods.
  ngtdm:
  # 中文：灰度依赖矩阵纹理特征；描述邻域内灰度依赖关系。
  # EN: GLDM texture features; describe gray-level dependencies within neighborhoods.
  gldm:
# Excluded: MCC, Imc1, Imc2 (unstable or eigvals/MKL crash on small supervoxel ROIs)
# 中文：★【按研究方案确认】PyRadiomics 全局参数，如归一化和离散化；会影响全部特征数值。
# EN: ★ STUDY-DESIGN REVIEW: PyRadiomics global settings, such as normalization/discretization, affect all features.
setting:
  # Normalization:
  # MR signal is usually relative, with large differences between scanners and vendors. By normalizing the image before
  # feature calculation, this confounding effect may be reduced. However, if only one specific scanner is used, or the
  # images reflect some absolute world value (e.g. ADC maps, T2maps (NOT T2 weighted)), consider disabling the
  # normalization.
  # 中文：是否在特征计算前归一化强度；MR 常需考虑，绝对定量图像通常需要谨慎。
  # EN: Whether to normalize intensities before feature extraction; often considered for MR and used cautiously for quantitative maps.
  normalize: false
  # normalize: false
  # normalizeScale: 100  # This allows you to use more or less the same bin width.
  # Resampling:
  # If slices are very thin (~1mm), such as in 3D scanned (isotropic) volumes, resampledPixelSpacing may be reduced to
  # (1, 1, 1). Furthermore, in case of isotropic volumes, consider disabling resampling.
  # On a side note: increasing the resampled spacing forces PyRadiomics to look at more coarse textures, which may or
  # may not increase accuracy and stability of your extracted features.
#  interpolator: 'sitkBSpline'
#  resampledPixelSpacing: [2, 2, 2]
  # Mask validation:
  # correctMask and geometryTolerance are not needed, as both image and mask are resampled, if you expect very small
  # masks, consider to enable a size constraint by uncommenting settings below:
  #minimumROIDimensions: 2
  #minimumROISize: 50
  # Image discretization:
  # The ideal number of bins is somewhere in the order of 16-128 bins. A possible way to define a good binwidt is to
  # extract firstorder:Range from the dataset to analyze, and choose a binwidth so, that range/binwidth remains approximately
  # in this range of bins.
  # 中文：固定灰度离散化宽度；会显著影响纹理特征，必须在研究方案中预先设定。
  # EN: Fixed gray-level discretization width; strongly affects textures and must be predefined.
  binWidth: 25  # Machine-learninganalysisofcontrast-enhancedCTradiomicspredictsrecurrenceofhepatocellularcarcinomaafterresection:Amulti-institutionalstudy
  # first order specific settings:
  # When normalizing, gray values below the mean will be negative. Shifting by 300 (3 StdDevs * 100) ensures that the
  # majority of voxels is positive (only outliers >3 SD lower than the mean will be negative).
  # 中文：灰度整体平移量；用于避免某些计算中的负值问题，通常保持示例值。
  # EN: Global gray-level shift; avoids negative values in some calculations. Usually keep the example.
  voxelArrayShift: 300
  # Misc:
  # default label value. Labels can also be defined in the call to featureextractor.execute, as a commandline argument,
  # or in a column "Label" in the input csv (batchprocessing)
  # label: 1
# =============================================================================
