# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit radiomics -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 中文：对每个受试者、每个模态的 ROI（mask）提取 PyRadiomics 特征，输出 CSV。
# EN:   Extract PyRadiomics features per subject/modality ROI → CSV tables.
#
# 运行 / Run:
#   habit radiomics -c config/radiomics/config_traditional_radiomics.yaml
#
# 【你只需要改标了 ★ 的项】
#   ★ 1. paths.images_folder / paths.out_dir
#   ★ 2. processing.process_image_types（模态名=文件夹名）
#
# 特征算子细节见同目录 parameter.yaml（一般勿改）。
#
# 【YAML 注意】
#   - 空格缩进；冒号后有空格；true/false 小写
#   - 路径一般不用引号；仅含空格或 # : * 等特殊字符时加引号
#       例：D:/data/images 可不加；"D:/my data/images" 有空格必须加
#   - Windows 推荐正斜杠 D:/work/...
#   - 相对路径相对本 YAML 目录解析
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
# 中文：`paths` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `paths` is a setting for this module; retain the example default initially and document any change.
# 中文：本区连接上游预处理影像、ROI mask 与输出特征表。输入根目录必须是一个研究队列，
#      而不是单个影像文件；将输出放在独立目录可避免覆盖原始临床数据。
# EN: Connects preprocessed images/ROI masks to exported feature tables. Use a cohort root and a separate output directory.
paths:
  # params_file 可省略：省略则用内置 roi 预设
  # params_file: ./parameter.yaml

  # 1. 必改路径 ★ / Paths (MUST EDIT)
  # ★ 影像根目录：下面必须有 images/ 与 masks/ 两个子目录
  #   正确：.../processed_images    错误：写成某个 .nii.gz 文件
  # 中文：★【必须修改】影像根目录，通常应同时包含 images/ 与 masks/ 子目录。
  # EN: ★ MUST EDIT: Image root, usually containing both images/ and masks/ folders.
  images_folder: ../../demo_data/preprocessed
  # ★ 输出目录（自动创建）
  # 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
  # EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
  out_dir: ../../demo_data/results/radiomics_traditional
# =============================================================================

# =============================================================================
# 2. ★【必须检查】处理范围与导出 / Processing scope and export
# 中文：模态清单必须与 images 目录、mask 对应关系和下游建模特征表一致。
# EN: Modality names must agree with image folders, mask pairing, and downstream feature tables.
# 中文：`processing` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `processing` is a setting for this module; retain the example default initially and document any change.
processing:
  # ⚠ 并行进程数：过大可能内存不足
  # 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
  # EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
  # 并行进程数。正整数；更多进程可加快队列处理，但每个进程会占用影像内存。普通电脑从 1–2 开始。
  # EN: Number of workers. More workers can accelerate a cohort but consume image memory; start with 1–2.
  n_processes: 2
  # 每处理 N 个文件保存一次中间结果。较小值更利于长任务恢复，但会增加磁盘写入。
  # EN: Save intermediate results every N files. Smaller values improve recovery but increase disk writes.
  save_every_n_files: 5
  # ★ 要提取的模态键（必须与数据文件夹名一致；本 demo 不是 T1/T2）
  # 中文：★【必须修改】要提取特征的模态名列表；必须与 images 下的目录名一致。
  # EN: ★ MUST EDIT: Modalities for extraction; they must match directories under images.
  # --- 2.1 待处理模态 / process_image_types ---
  process_image_types:
    - pre_contrast
    - LAP
    - PVP
    - delay_3min
# 中文：`export` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `export` is a setting for this module; retain the example default initially and document any change.
# 中文：导出设置只改变结果文件的组织方式，不改变已计算的特征值。为保证下游建模可追溯，
#      建议在同一研究中固定导出结构与文件格式。
# EN: Export settings organize result files without changing calculated values; keep them stable for downstream traceability.
export:
  # 中文：`export_by_image_type` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `export_by_image_type` is a setting for this module; retain the example default initially and document any change.
  # 是否每个模态分别导出一张表。true 便于检查单模态特征；false 仅适合已明确只需合并表的场景。
  # EN: Export one table per modality. true supports modality-level quality review.
  export_by_image_type: true
  # 中文：`export_combined` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `export_combined` is a setting for this module; retain the example default initially and document any change.
  # 是否额外导出按受试者合并的宽表。机器学习通常需要该表；合并前应核对所有模态的受试者 ID。
  # EN: Export a subject-level wide table. ML commonly needs it; verify subject-ID alignment before merging.
  export_combined: true
  # 中文：`export_format` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `export_format` is a setting for this module; retain the example default initially and document any change.
  # 导出格式。csv 便于在统计软件和机器学习流程中读取；不要改扩展名而不改此值。
  # EN: Export format. csv is broadly interoperable; do not rename file extensions without changing this value.
  export_format: csv
  # 中文：`add_timestamp` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `add_timestamp` is a setting for this module; retain the example default initially and document any change.
  # 是否在文件名加入运行时间。true 可避免覆盖旧结果，但会使下游脚本难以使用固定文件名。
  # EN: Add timestamps to filenames. true avoids overwrites but prevents stable downstream file paths.
  add_timestamp: false
# =============================================================================

# =============================================================================
# 3. 高级设置（首次保持默认）/ Advanced (keep defaults initially)
# EN: Advanced settings
# 中文：`logging` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `logging` is a setting for this module; retain the example default initially and document any change.
logging:
  # 中文：`level` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `level` is a setting for this module; retain the example default initially and document any change.
  level: INFO
  # 中文：`console_output` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `console_output` is a setting for this module; retain the example default initially and document any change.
  console_output: true
  # 中文：`file_output` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `file_output` is a setting for this module; retain the example default initially and document any change.
  file_output: true
# =============================================================================
