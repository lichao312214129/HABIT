# =============================================================================
# HABIT v1 document - the quickstart two-step analysis (demo data)
#
# Same analysis as the Python and YAML quickstart pages: raw intensities of
# the four DCE phases inside the LAP ROI, 30 k-means supervoxels per tumour,
# one k-means fit over the pooled supervoxels (2..10 habitats, elbow),
# nearest-centroid assignment, seed 0, fitted on subj001-subj004.
#
# Run from <work_dir> (the folder holding config/ and demo_data/):
#
#   habit check-config --config config/habitat/config_habitat_quickstart_v1.yaml
#   habit get-habitat --config config/habitat/config_habitat_quickstart_v1.yaml
#
# For a fuller configuration (winsorize / min-max, cohort binning,
# 50 supervoxels, connected-component clean-up, seed 42) see
# config_habitat_two_step.yaml; it defines different habitats by design.
#
# PATH SEMANTICS: v1 documents use paths as written, relative to the
# current working directory.
# =============================================================================

version: '1.0'
workflow: habitat
mode: train

spec:
  name: quickstart_two_step
  # Seeds partition and fit.
  random_seed: 0
  stages:
    # extract: one intensity column per DCE phase, inside the LAP ROI.
    # The YAML loader keys the ROI mask by the FIRST modality, so LAP is
    # listed first; the Python page lists pre_contrast first. The column
    # order is the only difference and the habitat maps are identical.
    - name: extract
      component: {name: raw, params: {modalities: [LAP, pre_contrast, PVP, delay_3min], roi: LAP}}
    # partition: 30 k-means supervoxels per tumour.
    - name: partition
      component: {name: kmeans, params: {n_supervoxels: 30}}
    # pool: one matrix for every training subject, then one fit.
    - name: pool
      component: {name: pool}
    # fit: search 2..10 habitats and keep the elbow; n_init=10 restarts.
    - name: fit
      component: {name: kmeans, params: {min_habitats: 2, max_habitats: 10, validation: elbow, n_init: 10}}
    # assign: nearest centroid writes the shared habitat ids.
    - name: assign
      component: {name: nearest_centroid}
    # quantify: one row per subject.
    - name: volume
      component: {name: volume}
    - name: msi
      component: {name: msi}
    - name: ith
      component: {name: ith_score}
    - name: graph
      component: {name: graph, params: {include_extended_metrics: false}}

data:
  # Manifest listing subj001-subj004 and their LAP masks.
  source: config/habitat/file_habitat_quickstart.yaml

policy:
  workers: 1
  backend: serial

output:
  out_dir: demo_data/results/habitat_quickstart
  save_images: true
  save_results_csv: true
  habitats_results_format: csv
