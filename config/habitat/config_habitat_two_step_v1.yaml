# =============================================================================
# HABIT v1 configuration document — two-step habitat analysis (demo data)
#
# This is the NATIVE v1 layout: one document = version + workflow + mode +
# spec (what to compute) + data (where the cohort lives) + policy (how to
# execute) + output (what to persist). The spec section is one-to-one with
# habit.HabitatSpec — what you see here is exactly what exists in Python.
#
# Run it (v1 documents are executed through the Python API, not get-habitat):
#
#   E:\conda\mconda\envs\py310\python.exe -c "import habit; habit.recipes.run_from_yaml('config/habitat/config_habitat_two_step_v1.yaml', save=True)"
#
# Validate without running:
#
#   habit check-config -c config/habitat/config_habitat_two_step_v1.yaml
#
# PATH SEMANTICS: unlike v0 configs (relative to the YAML file), v1 documents
# use paths as written — run from the repository root, or use absolute paths.
# =============================================================================

version: '1.0'
workflow: habitat
mode: train

# --- What to compute (mirrors habit.HabitatSpec field for field) ----------
# The spec name must start with "habitat_"; the remainder ("two_step") selects
# the recipe. Parameters match the golden demo baseline.
spec:
  name: habitat_two_step
  # Voxel level: concatenate raw intensities of the four DCE phases.
  # Modality names must match the folder names under images/<subject>/.
  voxel_feature_extractor:
    name: raw
    params:
      modalities: [pre_contrast, LAP, PVP, delay_3min]
  # Supervoxel level: per-subject k-means over voxel features.
  supervoxelizer:
    name: kmeans
    params:
      n_supervoxels: 50
      max_iter: 300
      n_init: 10
  # Cohort level: k-means over pooled supervoxels; habitat count chosen
  # automatically within [min_habitats, max_habitats] by the elbow criterion.
  habitat_model_fitter:
    name: kmeans
    params:
      min_habitats: 2
      max_habitats: 10
      validation: elbow
      max_iter: 300
      n_init: 10
  # Assignment: each supervoxel takes the habitat of its nearest centroid.
  habitat_assigner:
    name: nearest_centroid
    params: {}
  # Habitat feature families, computed after assignment (they enrich the
  # feature table; they do not change the habitat maps or the model).
  habitat_features:
    - name: volume          # voxel counts and volume fractions per habitat
      params: {}
    - name: msi             # multiregional spatial interaction features
      params: {}
    - name: ith_score       # ITH score and per-habitat fragmentation
      params: {}
    - name: non_radiomics   # region counts / volume ratios (light)
      params: {}
    # Heavy PyRadiomics families (opt-in; require pyradiomics):
    # - name: traditional
    #   params: {}
    # - name: whole_habitat
    #   params: {}
    # - name: each_habitat
    #   params: {}
  # Per-subject chain, applied before supervoxelization.
  voxel_feature_preprocessors:
    - name: winsorize
      params:
        winsor_limits: [0.05, 0.05]
        across_features: false
    - name: minmax
      params:
        across_features: false
  # Cohort-level chain, fitted once on the pooled training units; the fitted
  # state is stored inside the saved HabitatModel.
  cohort_feature_preprocessors:
    - name: binning
      params:
        n_bins: 10
        bin_strategy: uniform
        across_features: false
  # Seed for every stochastic component; part of the spec fingerprint.
  random_seed: 42

# --- Where the cohort lives -------------------------------------------------
data:
  # Either a conventional layout root:
  #   <source>/images/<subject>/<modality>/ and <source>/masks/<subject>/<roi>/
  # or a manifest YAML that lists image/mask file paths (recommended when
  # modalities are already registered and you keep one ROI per subject):
  #   source: config/habitat/file_habitat_registered_single_roi.yaml
  # Folder roots resolve against the CURRENT WORKING DIRECTORY (v1 semantics);
  # relative paths inside a manifest resolve from that manifest's directory.
  source: demo_data/preprocessed

# --- How to execute (mirrors habit.RunPolicy; every key optional) -----------
policy:
  workers: 1                 # 1 = serial; >1 with backend: process for parallelism
  backend: serial            # serial | process
  resume: true               # reuse checkpointed per-subject results
  subject_timeout_sec: 900

# --- What to persist --------------------------------------------------------
output:
  out_dir: demo_data/results/habitat_two_step_v1
  save_images: true          # NRRD habitat maps (and supervoxel maps for two_step)
  save_results_csv: true     # habitats unit table
  habitats_results_format: parquet   # parquet | csv
  plot_curves: true          # 3D / interactive clustering plots
