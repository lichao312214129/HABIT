# =============================================================================
# Two-step habitat analysis on the demo data — CLI edition (v0 config format)
# 生境分析（两步法）demo 配置 —— 命令行版（v0 配置格式）
#
# Run / 运行:
#   habit check-config -c config/habitat/config_habitat_two_step_cli_demo.yaml
#   habit get-habitat  -c config/habitat/config_habitat_two_step_cli_demo.yaml -m train
#
# Notes / 说明:
#   - v0 format: relative paths resolve against THIS file's directory.
#     v0 格式：相对路径以本 YAML 所在文件夹为起点。
#   - The CLI translates this document into the same v1 spec the Python demo
#     (examples/habitat_v1_two_step_demo.py) builds in code, then runs the
#     identical two_step recipe.
#     CLI 会把本配置翻译成与 Python 示例相同的 v1 spec，再运行同一个 two_step 配方。
#   - YAML safety: spaces only (no tabs); one space after each colon;
#     lowercase true/false/null.
#     YAML 防错：只用空格缩进；冒号后一个空格；true/false/null 小写。
# =============================================================================

run_mode: train
# ★ Input root with images/ and masks/ in the conventional layout.
# ★ 输入数据根目录（含 images/ 与 masks/）。
data_dir: ../../demo_data/preprocessed/processed_images
# ★ Output directory for habitat maps, tables, model archive and manifest.
# ★ 输出目录（生境图、特征表、模型文件、运行清单）。
out_dir: ../../demo_data/results/habitat_two_step_cli

feature_construction:
  # Voxel level: concatenate raw intensities of the three DCE phases.
  # Modality names must match folder names under images/<subject>/.
  # 体素级特征：拼接三个 DCE 期相的原始强度；模态名须与数据文件夹一致。
  voxel_level:
    method: concat(raw(delay2), raw(delay3), raw(delay5))
    params: {}
  # Supervoxel level: average voxel features within each supervoxel.
  # 超体素级：对每个超体素内的体素特征取均值。
  supervoxel_level:
    supervoxel_file_keyword: '*_supervoxel.nrrd'
    method: mean_voxel_features()
    params: {}
  # Per-subject preprocessing, before supervoxelization.
  # 个体级预处理（每位受试者内部，超体素化之前）。
  preprocessing_for_subject_level:
    methods:
      - method: winsorize
        winsor_limits: [0.05, 0.05]
        global_normalize: false
      - method: minmax
        global_normalize: false
  # Cohort-level preprocessing, fitted once on the pooled training units.
  # 组级预处理（在汇总后的训练单元上拟合一次）。
  preprocessing_for_group_level:
    methods:
      - method: binning
        n_bins: 10
        bin_strategy: uniform
        global_normalize: false

habitat_segmentation:
  clustering_mode: two_step
  # Within-subject supervoxel clustering.
  # 个体内超体素聚类。
  supervoxel:
    algorithm: kmeans
    n_clusters: 50
    max_iter: 300
    n_init: 10
    one_step_settings:
      min_clusters: 2
      max_clusters: 10
      fixed_n_clusters:
      selection_method: elbow
      plot_validation_curves: true
  # Cohort-level habitat clustering; habitat count chosen by the elbow
  # criterion within [2, max_clusters].
  # 组级生境聚类；簇数由 elbow 准则在 [2, max_clusters] 内自动选择。
  habitat:
    algorithm: kmeans
    max_clusters: 10
    habitat_cluster_selection_method:
      - elbow
    fixed_n_clusters:
    max_iter: 300
    n_init: 10

# Advanced settings — defaults are fine for the 2-subject demo.
# 高级设置 —— 2 例 demo 用默认值即可。
processes: 2
plot_curves: true
save_images: true
save_results_csv: true
random_state: 42
resume: true
debug: false
