# =============================================================================
# Path-list YAML (recommended input for HABIT)
# 路径清单：把每例影像 / ROI 的真实路径写在这里，再在工作流配置里设置：
#
#   v0.1:  data_dir: ./file_habitat_registered_single_roi.yaml
#   v1:    data.source: config/habitat/file_habitat_registered_single_roi.yaml
#
# ★ = replace with your own values. Modality keys (T1, T2, …) must match the
# habitat / radiomics config (feature_construction or HabitatSpec).
#
# Relative paths resolve from THIS file's directory (not the shell cwd).
# Direct .nii / .nii.gz files → keep auto_select_first_file: false.
# =============================================================================

# Keep false when paths point at files. Set true only if a path is a folder
# that contains one NIfTI (HABIT then picks the first file in that folder).
auto_select_first_file: false

images:
  # ★ MUST EDIT: subject ID (same ID must appear under masks)
  subj001:
    # ★ MUST EDIT: modality key + path to that modality's image
    T1: D:/study/registered/subj001/T1.nii.gz
    # ★ MUST EDIT: modality key + path to that modality's image
    T2: D:/study/registered/subj001/T2.nii.gz
  # ★ MUST EDIT: next subject ID
  subj002:
    # ★ MUST EDIT
    T1: D:/study/registered/subj002/T1.nii.gz
    # ★ MUST EDIT
    T2: D:/study/registered/subj002/T2.nii.gz

masks:
  # One ROI per subject is enough when modalities are already co-registered.
  # Prefer the first modality key used in the habitat config (here T1).
  # ★ MUST EDIT: subject ID (must match images)
  subj001:
    # ★ MUST EDIT: mask key (prefer first modality) + path to ROI NIfTI
    T1: D:/study/registered/subj001/roi.nii.gz
  # ★ MUST EDIT
  subj002:
    # ★ MUST EDIT
    T1: D:/study/registered/subj002/roi.nii.gz
