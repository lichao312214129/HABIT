# Cloud coverage: one-step habitat train with elbow selection (v0 layout).
# Adapted from config/habitat/config_habitat_one_step_elbow_train.yaml.
run_mode: train
data_dir: @DATA_ROOT@
out_dir: @OUT_DIR@

feature_construction:
  voxel_level:
    method: concat(raw(delay2), raw(delay3), raw(delay5))
    params: {}
  preprocessing_for_subject_level:
    methods:
      - method: winsorize
        winsor_limits: [0.05, 0.05]
        global_normalize: false
      - method: minmax
        global_normalize: false
  preprocessing_for_group_level:
    methods:
      - method: binning
        n_bins: 10
        bin_strategy: uniform
        global_normalize: false

habitat_segmentation:
  clustering_mode: one_step
  supervoxel:
    algorithm: kmeans
    n_clusters: 8
    max_iter: 100
    n_init: 5
    one_step_settings:
      min_clusters: 2
      max_clusters: 5
      fixed_n_clusters:
      selection_method: elbow
      plot_validation_curves: true
  habitat:
    algorithm: kmeans
    min_clusters: 2
    max_clusters: 5
    habitat_cluster_selection_method:
      - elbow
    fixed_n_clusters:
    max_iter: 100
    n_init: 5

processes: 1
cap_processes_to_gpu_pool: false
individual_subject_timeout_sec: 300
oom_backoff: false
resume: false
plot_curves: false
save_results_csv: true
random_state: 42
debug: false
save_images: true
