# Cloud coverage: holdout ML train run "radiomics" for model comparison.
# Adapted from config/machine_learning/config_machine_learning_kfold_demo.yaml
# (holdout split instead of K-fold; all_prediction_results.csv feeds
# habit compare).
input:
  - path: @RADIOMICS_CSV@
    name: radiomics_
    subject_id_col: subject_id
    label_col: label
    features:

output: @OUT_DIR@

run_mode: train
split_method: stratified
test_size: 0.3
random_state: 42

normalization:
  method: z_score

feature_selection_methods:
  # NOTE: v1 always z-scores BEFORE selection (v0's before_z_score: true is
  # not expressible; see LegacyConfigAdapter warning). After z-scoring every
  # feature has variance ~1.0, so top_k would pick an arbitrary subset and
  # could drop the planted signal feature. threshold: 0.0 keeps all
  # nonzero-variance features while still exercising the selector path.
  - method: variance
    params:
      threshold: 0.0
      plot_variances: false

is_visualize: true
is_save_model: true

models:
  LogisticRegression:
    params:
      random_state: 42
      max_iter: 1000
      C: 1.0
      penalty: "l2"
      solver: "lbfgs"

visualization:
  enabled: true
  plot_types:
    - roc
    - dca
    - calibration
    - pr
    - confusion
