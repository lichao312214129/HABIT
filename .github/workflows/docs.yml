name: Build documentation

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - 'habit/**'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies (Graphviz)
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          # The API reference uses autodoc/autosummary, so Sphinx must be able
          # to import habit and its core dependencies at build time. This
          # mirrors the CI test environment (requirements-ci.txt + the package
          # itself without re-resolving dependencies).
          pip install -r requirements-ci.txt
          pip install --no-deps -e .
          # Sphinx extensions required by docs/source/conf.py. Do not install
          # all of docs/requirements.txt here (it pulls AutoGluon / SHAP / …).
          pip install sphinx==7.4.7 sphinx-rtd-theme==2.0.0 \
            "sphinxcontrib-mermaid>=0.9.2" \
            "sphinx-copybutton>=0.5.2" \
            "sphinx-gallery>=0.17.0"

      - name: Build Sphinx documentation
        run: |
          cd docs
          make html
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Compile RST / autodoc only. Gallery scripts need local demo_data/
          # and must not publish empty figures over the gh-pages site.
          HABIT_PLOT_GALLERY: "0"

      - name: Verify Mermaid diagrams rendered
        run: |
          ARCH_HTML="docs/build/html/development/architecture.html"
          if ! grep -q 'mermaid.esm.min.mjs' "$ARCH_HTML"; then
            echo "ERROR: Mermaid JS not embedded in $ARCH_HTML"
            echo "Ensure sphinxcontrib-mermaid is installed and loaded in docs/source/conf.py"
            exit 1
          fi
          echo "Mermaid diagrams present in architecture.html"
