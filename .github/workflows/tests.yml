name: Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'habit/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'installer/**'
      - 'launchers/**'
      - 'tools/**'
      - 'config/**'
      - 'developer/build_lightweight_release.ps1'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'habit/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'installer/**'
      - 'launchers/**'
      - 'tools/**'
      - 'config/**'
      - 'developer/build_lightweight_release.ps1'
      - '.github/workflows/tests.yml'

jobs:
  packaging:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install and verify wheel
        shell: pwsh
        run: |
          $wheel = @(
            Get-ChildItem dist\habitat_analysis-*.whl -ErrorAction SilentlyContinue
            Get-ChildItem dist\HABIT-*.whl -ErrorAction SilentlyContinue
          ) | Select-Object -First 1
          if (-not $wheel) {
            throw "habitat-analysis wheel was not created."
          }
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          python -c "import importlib.metadata as md, pathlib, sys, habit; files = {str(path).replace(chr(92), '/') for path in md.distribution('HABIT').files}; required = {'habit/py.typed', 'habit/api/registry.py', 'habit/recipes/habitat.py', 'habit/contracts/subject.py', 'habit/resources/radiomics/params_voxel_radiomics.yaml'}; missing = required - files; assert not missing, f'Missing wheel files: {sorted(missing)}'; assert not any(path.startswith('tests/') for path in files), 'tests package leaked into wheel'; from habit.utils.radiomics_preset_utils import get_preset_path; assert pathlib.Path(get_preset_path('voxel')).is_file(); assert pathlib.Path(habit.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
          Pop-Location

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install API test dependencies
        run: |
          pip install --upgrade pip
          # PyRadiomics is an optional extra (HABIT[radiomics]). CI still needs
          # it for radiomics tests. PyPI often serves only an sdist that does
          # not declare numpy as a build dependency, so install numpy first and
          # build without isolation.
          pip install "numpy==1.26.1" wheel setuptools
          pip install "pyradiomics>=3.0,<4" --no-build-isolation
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Check formatting (black)
        run: |
          pip install black==24.10.0
          black --check habit/api habit/_version.py tests/api

      - name: Check public API and v1 layer types
        run: |
          # habit/kernels and habit/domain are intentionally not checked yet:
          # kernels carries vendored PyRadiomics code (~350 errors) and domain
          # still has ~50 typing errors; both are tracked as follow-up work.
          mypy habit/api habit/contracts habit/adapters habit/execution habit/spec

      - name: Run public, architecture, and v1 layer tests
        run: |
          pytest tests/api/ tests/integration/test_python_api.py tests/test_architecture_contracts.py tests/test_packaging_contracts.py tests/test_installer_contracts.py tests/test_import_lightweight.py tests/contracts/ tests/domain/ tests/execution/ tests/compat/ tests/spec/ tests/registry/ tests/kernels/ tests/golden/ -m "not slow" --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
