name: Tests

on:
  push:
    branches: [main, master]
    paths:
      - 'habit/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'installer/**'
      - 'developer/build_lightweight_release.ps1'
      - '一键安装HABIT.bat'
      - '一键启用HABIT-GPU.bat'
      - '一键启用HABIT-AutoML.bat'
      - '一键启用HABIT-进阶分析.bat'
      - '启动HABIT命令行.bat'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'habit/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'installer/**'
      - 'developer/build_lightweight_release.ps1'
      - '一键安装HABIT.bat'
      - '一键启用HABIT-GPU.bat'
      - '一键启用HABIT-AutoML.bat'
      - '一键启用HABIT-进阶分析.bat'
      - '启动HABIT命令行.bat'
      - '.github/workflows/tests.yml'

jobs:
  packaging:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install and verify wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\HABIT-*.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "HABIT wheel was not created."
          }
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          python -c "import importlib.metadata as md, pathlib, sys, habit; files = {str(path).replace(chr(92), '/') for path in md.distribution('HABIT').files}; required = {'habit/py.typed', 'habit/core/machine_learning/statistics/delong_test.py', 'habit/core/machine_learning/evaluation/metrics.py', 'habit/resources/radiomics/params_voxel_radiomics.yaml'}; missing = required - files; assert not missing, f'Missing wheel files: {sorted(missing)}'; assert not any(path.startswith('tests/') for path in files), 'tests package leaked into wheel'; from habit.utils.radiomics_preset_utils import get_preset_path; assert pathlib.Path(get_preset_path('voxel')).is_file(); assert pathlib.Path(habit.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
          Pop-Location

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install API test dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Check formatting (black)
        run: |
          pip install black==24.10.0
          black --check habit/api habit/_version.py tests/api

      - name: Check public API types
        run: |
          mypy habit/api

      - name: Run public and architecture tests
        run: |
          pytest tests/api/ tests/integration/test_python_api.py tests/test_architecture_contracts.py tests/test_packaging_contracts.py tests/test_installer_contracts.py -m "not slow" --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
