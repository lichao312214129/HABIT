name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'habit/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'installer/**'
      - 'launchers/**'
      - 'tools/**'
      - 'config/**'
      - 'developer/build_lightweight_release.ps1'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'habit/**'
      - 'tests/**'
      - 'requirements-ci.txt'
      - 'setup.py'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'installer/**'
      - 'launchers/**'
      - 'tools/**'
      - 'config/**'
      - 'developer/build_lightweight_release.ps1'
      - '.github/workflows/tests.yml'

jobs:
  packaging:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Install and verify wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem dist\habitat_analysis-*.whl | Select-Object -First 1
          if (-not $wheel) {
            throw "habitat-analysis wheel was not created."
          }
          python -m pip install --force-reinstall --no-deps $wheel.FullName
          Push-Location $env:RUNNER_TEMP
          python -c "import importlib.metadata as md, pathlib, sys, habit; files = {str(path).replace(chr(92), '/') for path in md.distribution('habitat-analysis').files}; required = {'habit/py.typed', 'habit/api/registry.py', 'habit/recipes/habitat.py', 'habit/contracts/subject.py', 'habit/resources/radiomics/params_voxel_radiomics.yaml'}; missing = required - files; assert not missing, f'Missing wheel files: {sorted(missing)}'; assert not any(path.startswith('tests/') for path in files), 'tests package leaked into wheel'; from habit.utils.radiomics_preset_utils import get_preset_path; assert pathlib.Path(get_preset_path('voxel')).is_file(); assert pathlib.Path(habit.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve())"
          Pop-Location

  # The only job that proves HABIT's REQUIRED dependency set is self-contained.
  # Every other job installs the test dependencies (which include the optional
  # backends), so none of them would notice a new mandatory import creeping into
  # the habitat kernel path. This one installs the built distribution with NO
  # extras -- a real resolve, not `-e .` and not `--no-deps` -- and then runs the
  # bare-install smoke contract, which trains a habitat model with matplotlib,
  # seaborn, pydicom, pyarrow, openpyxl, skimage and radiomics all hidden.
  bare-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install habitat-analysis with no extras
        run: |
          python -m pip install --upgrade pip
          # A plain resolve of [project.dependencies], exactly what a user gets
          # from `pip install habitat-analysis`.
          python -m pip install .
          python -m pip install pytest
          # Fail early and loudly if an optional backend arrived transitively:
          # the smoke test hides them anyway, but a leak here would mean the
          # required set is no longer what pyproject.toml claims.
          python - <<'PY'
          import importlib.util
          import sys

          leaked = [
              name
              for name in (
                  "matplotlib",
                  "seaborn",
                  "pydicom",
                  "pyarrow",
                  "openpyxl",
                  "skimage",
                  "radiomics",
              )
              if importlib.util.find_spec(name) is not None
          ]
          if leaked:
              sys.exit(f"Optional packages installed by a bare install: {leaked}")
          print("bare install contains no optional backend")
          PY

      - name: Report the bare-install footprint
        run: |
          python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          du -sh "$(python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")"
          python -m pip list

      - name: Run the bare-install smoke contract
        # Run from a scratch directory so `habit` resolves to the INSTALLED
        # package rather than the repository checkout, and without PYTHONPATH
        # for the same reason.
        run: |
          mkdir -p "$RUNNER_TEMP/bare"
          cd "$RUNNER_TEMP/bare"
          python -m pytest "$GITHUB_WORKSPACE/tests/test_packaging_contracts.py" \
            -p no:cacheprovider -q
          python -c "import habit, pathlib, sys; assert pathlib.Path(habit.__file__).resolve().is_relative_to(pathlib.Path(sys.prefix).resolve()), habit.__file__"
          habit --help

  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-ci.txt

      - name: Install API test dependencies
        run: |
          pip install --upgrade pip
          # PyRadiomics is an optional extra (habitat-analysis[radiomics]). CI
          # still needs it for radiomics tests. PyPI serves only the 3.1.0
          # sdist for CPython 3.10+, which neither declares numpy as a build
          # dependency nor bundles versioneer.py, so install the build
          # requirements first and build without isolation.
          pip install "numpy==1.26.1" wheel setuptools versioneer
          pip install "pyradiomics>=3.0,<4" --no-build-isolation
          pip install -r requirements-ci.txt
          pip install --no-deps -e .

      - name: Check formatting (black)
        run: |
          pip install black==24.10.0
          black --check habit/api habit/_version.py tests/api

      - name: Check public API and v1 layer types
        run: |
          # habit/kernels and habit/domain are intentionally not checked yet:
          # kernels carries vendored PyRadiomics code (~350 errors) and domain
          # still has ~50 typing errors; both are tracked as follow-up work.
          mypy habit/api habit/contracts habit/adapters habit/execution habit/spec

      - name: Run public, architecture, and v1 layer tests
        run: |
          pytest tests/api/ tests/integration/test_python_api.py tests/test_architecture_contracts.py tests/test_packaging_contracts.py tests/test_installer_contracts.py tests/test_import_lightweight.py tests/contracts/ tests/domain/ tests/execution/ tests/compat/ tests/spec/ tests/registry/ tests/kernels/ tests/golden/ -m "not slow" --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}
