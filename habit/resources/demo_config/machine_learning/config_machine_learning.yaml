# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit model -c <配置文件.yaml> 或 habit cv -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# Machine Learning Configuration Template
#
# This template is based on actual code implementation
# All parameters listed here are supported by the code
#
# Quick Start:
#   Training:   habit model --config config/machine_learning/config_machine_learning.yaml --mode train
#   Prediction: habit model --config config/machine_learning/config_machine_learning_predict.yaml --mode predict
#
# NOT overlapping with:
#   config_machine_learning_{radiomics,clinical,kfold_demo}.yaml — demo CSV paths.
# Data Input Configuration
# Can specify single or multiple input files
# Multiple files will be merged by subject_id_col

# 中文：★【必须检查】输入数据配置；多表时每一项都要填写路径、ID 列和标签列。
# EN: ★ REVIEW: Input-data configuration; for multiple tables, complete path, ID and label in each item.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
input:
# 中文：★【必须修改】文件或目录路径；相对路径以本 YAML 所在文件夹为起点解析。
# EN: ★ MUST EDIT: File or directory path; relative paths resolve from this YAML file.
- path: ../../demo_data/ml_data/breast_cancer_dataset.csv
  name: clinical_
  # 中文：★【必须修改】CSV 中唯一受试者 ID 的列名；必须与实际表头完全一致。
  # EN: ★ MUST EDIT: Unique subject-ID column in the CSV; must exactly match its header.
  subject_id_col: subject_id
  # 中文：★【必须修改】真实结局/标签列名；二分类通常使用 0 和 1。
  # EN: ★ MUST EDIT: True outcome/label column; binary classification normally uses 0 and 1.
  label_col: label
  # 中文：特征列限制；留空/null 通常表示自动使用可用特征，指定列表时必须与表头一致。
  # EN: Feature-column restriction; empty/null usually auto-selects available features; named columns must match headers.
  features:
# 中文：★【必须修改】本流程的结果输出目录；与 input 数据目录分开保存。
# EN: ★ MUST EDIT: Workflow output directory, kept separate from input data.
output: ../../demo_data/results/ml/default
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
# Data Splitting Configuration
# Split method
# Options: random, stratified, custom
# 中文：数据集划分方式：random 随机、stratified 保持类别比例、custom 使用 ID 清单。
# EN: Dataset split: random, stratified to preserve class ratios, or custom using ID lists.
# --- 2.1 队列划分 / split_method ---
split_method: custom
# For random or stratified splits
# test_size: 0.3  # Proportion for test set (0.0-1.0)
# random_state: 42  # Random seed
# For custom splits (required if split_method is custom)
# 中文：★【必须修改】自定义训练集 ID 清单；每行一个受试者 ID，仅 custom 划分时使用。
# EN: ★ MUST EDIT: Custom training-ID list, one subject per line; used with custom splits.
train_ids_file: ../../demo_data/ml_data/train_ids.txt  # One ID per line
# 中文：★【必须修改】自定义测试集 ID 清单；每行一个受试者 ID，仅 custom 划分时使用。
# EN: ★ MUST EDIT: Custom test-ID list, one subject per line; used with custom splits.
test_ids_file: ../../demo_data/ml_data/test_ids.txt  # One ID per line
# Normalization Configuration

# 中文：特征标准化设置；通常保持 z_score，避免不同量纲主导模型。
# EN: Feature normalization; z_score is normally retained to prevent scale dominance.
# --- 2.2 特征标准化 / normalization ---
normalization:
  # method: z_score (default, StandardScaler)
  # 中文：所选方法名称；可选值受所在模块限制，修改前请查阅该模块的完整说明。
  # EN: Selected method; allowed values depend on this module. Read its full documentation before changing.
  method: z_score
  # method: min_max (MinMaxScaler)
  # params:
  #   feature_range: [0, 1]
  # method: robust (RobustScaler)
  # params:
  #   quantile_range: [25.0, 75.0]
  #   with_centering: true
  #   with_scaling: true
  # method: max_abs (MaxAbsScaler)
  # method: normalizer (Normalizer)
  # params:
  #   norm: l2  # Options: l1, l2, max
  # method: quantile (QuantileTransformer)
  # params:
  #   n_quantiles: 1000
  #   output_distribution: uniform  # Options: uniform, normal
  # method: power (PowerTransformer)
  # params:
  #   method: yeo-johnson  # Options: yeo-johnson, box-cox
  #   standardize: true
# Resampling Configuration
# Resampling is applied only while fitting the training data. It is skipped
# automatically during validation, testing, and prediction so row counts stay
# unchanged outside the training fold.
# 中文：类别不平衡重采样设置；仅在训练数据内执行，开启前确认研究方案。
# EN: Class-imbalance resampling; it runs only on training data. Confirm it in the study protocol.
# --- 2.3 类别不平衡处理 / resampling ---
resampling:
  # 中文：功能开关；false 表示不执行该模块，true 表示使用其下方设置。
  # EN: Feature switch; false skips this module and true uses its nested settings.
  enabled: false  # Set to true to enable class-imbalance resampling
  # 中文：所选方法名称；可选值受所在模块限制，修改前请查阅该模块的完整说明。
  # EN: Selected method; allowed values depend on this module. Read its full documentation before changing.
  method: random_over  # Options: random_over, random_under, smote
  position: before_model  # Options: before_feature_selection, before_normalization, after_normalization, before_model
  ratio: 1.0  # Target sampling ratio passed to the selected resampling method
  # 中文：随机种子；保持固定可复现结果，除非研究设计明确要求改变。
  # EN: Random seed; keep it fixed for reproducibility unless the study design requires otherwise.
  random_state: 42  # Random seed used by the resampling method
# Feature Selection Configuration
# Feature selection methods applied sequentially
# Each method can run before or after z-score normalization
# 中文：特征选择步骤，按列表顺序依次执行；应只在训练折内拟合以避免信息泄露。
# EN: Feature-selection steps run in list order and must be fitted inside training folds to avoid leakage.
# --- 2.4 特征筛选 / feature_selection_methods ---
feature_selection_methods:
  # ICC (Intraclass Correlation Coefficient)
  # - method: icc
  #   params:
  #     icc_results: ./results/icc_results.json  # Path to ICC JSON file
  #     keys: [comparison_key]  # Key(s) in ICC results to use
  #     threshold: 0.8  # Minimum ICC value (0.0-1.0)
  #     before_z_score: false
  # Variance Threshold
  # - method: variance
  #   params:
  #     threshold: 0.2  # Minimum variance
  #     plot_variances: true  # Generate variance plot
  #     before_z_score: true  # MUST be true (z-score makes all variances=1)
  # Statistical Test (t-test or Mann-Whitney U)
  # - method: statistical_test
  #   params:
  #     p_threshold: 0.05  # Maximum p-value
  #     # n_features_to_select: 20  # Alternative: select top N features (integer >= 1 = count, 0-1 = ratio, e.g. 0.2 keeps top 20%)
  #     normality_test_threshold: 0.05
  #     plot_importance: true
  #     before_z_score: false
  #     # force_test: ttest  # Options: ttest, mannwhitney
  # VIF (Variance Inflation Factor)
  # - method: vif
  #   params:
  #     max_vif: 10  # Maximum allowed VIF
  #     visualize: false
  #     before_z_score: false
  # Correlation Threshold
# 中文：所选方法名称；可选值受所在模块限制，修改前请查阅该模块的完整说明。
# EN: Selected method; allowed values depend on this module. Read its full documentation before changing.
- method: correlation
  # 中文：该方法的参数集合；首次使用应保持当前默认值，修改前请记录研究依据。
  # EN: Parameter set for this method; keep defaults initially and document any study-driven change.
  params:
    threshold: 0.8
    # 中文：所选方法名称；可选值受所在模块限制，修改前请查阅该模块的完整说明。
    # EN: Selected method; allowed values depend on this module. Read its full documentation before changing.
    method: spearman
    visualize: true
    before_z_score: false
# 中文：待训练模型列表；可保留一个模型起步，增加模型会增加运行时间和结果文件。
# EN: Models to train; start with one model. More models increase runtime and result files.
# --- 3. 候选模型 / models ---
models:
  # Logistic Regression

  # --- LogisticRegression ---
  LogisticRegression:
    # 中文：该方法的参数集合；首次使用应保持当前默认值，修改前请记录研究依据。
    # EN: Parameter set for this method; keep defaults initially and document any study-driven change.
    params:
      # 中文：随机种子；保持固定可复现结果，除非研究设计明确要求改变。
      # EN: Random seed; keep it fixed for reproducibility unless the study design requires otherwise.
      random_state: 42
      max_iter: 1000
      C: 1.0  # Inverse regularization strength
      # 中文：`penalty` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
      # EN: `penalty` is a setting for this module; retain the example default initially and document any change.
      penalty: l2  # Options: l1, l2, elasticnet, none
      # 中文：`solver` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
      # EN: `solver` is a setting for this module; retain the example default initially and document any change.
      solver: lbfgs  # Options: lbfgs, liblinear, newton-cg, sag, saga
  # AutoGluon Tabular (Automated ML)
  # AutoGluon splits its API in two: predictor: goes to TabularPredictor(...),
  # fit: goes to TabularPredictor.fit(...). Any AutoGluon parameter can be used.
  # AutoGluonTabular:
  #   params:
  #     random_state: 42
  #     predictor:
  #       path: ./ml_data/autogluon_models  # Model save directory
  #       label: label  # Label column name
  #       eval_metric: roc_auc  # Optimization metric
  #       verbosity: 2  # 0-4
  #     fit:
  #       time_limit: 30  # Training time limit (seconds)
  #       presets: high_quality  # Options: best_quality, high_quality, good_quality, medium_quality, optimize_for_deployment
  #       num_bag_folds: 5  # Any other TabularPredictor.fit() parameter works too
  # Linear Support Vector Machine (LinearSVC — no kernel support)
  # SVM:
  #   params:
  #     random_state: 42
  #     C: 1.0
  #     max_iter: 1000
  # Kernel Support Vector Machine (SVC — use this when a kernel is needed)
  # SVC:
  #   params:
  #     random_state: 42
  #     C: 1.0
  #     kernel: rbf  # Options: linear, poly, rbf, sigmoid
  #     gamma: scale  # Options: scale, auto, or float
  #     probability: true  # Required for probability predictions
  # Random Forest
  # RandomForest:
  #   params:
  #     random_state: 42
  #     n_estimators: 100
  #     max_depth: null  # null = unlimited
  #     min_samples_split: 2
  #     min_samples_leaf: 1
  #     max_features: sqrt  # Options: sqrt, log2, int, float, none
  #     class_weight: balanced  # Options: balanced, balanced_subsample, dict, none
  # XGBoost
  # XGBoost:
  #   params:
  #     random_state: 42
  #     n_estimators: 100
  #     max_depth: 3
  #     learning_rate: 0.1
  #     subsample: 0.8
  #     colsample_bytree: 0.8
  #     objective: binary:logistic
  #     eval_metric: logloss
  # K-Nearest Neighbors
  # KNN:
  #   params:
  #     n_neighbors: 5
  #     weights: uniform  # Options: uniform, distance
  #     algorithm: auto  # Options: auto, ball_tree, kd_tree, brute
  #     metric: minkowski
  #     p: 2  # Power parameter for Minkowski (p=2 is Euclidean)
  # Multi-layer Perceptron
  # MLP:
  #   params:
  #     random_state: 42
  #     hidden_layer_sizes: [100, 50]  # List of layer sizes
  #     activation: relu  # Options: identity, logistic, tanh, relu
  #     solver: adam  # Options: lbfgs, sgd, adam
  #     alpha: 0.0001  # L2 penalty
  #     learning_rate: constant  # Options: constant, invscaling, adaptive
  #     learning_rate_init: 0.001
  #     max_iter: 200
  #     early_stopping: false
  # Gaussian Naive Bayes
  # GaussianNB:
  #   params:
  #     var_smoothing: 1.0e-9
  # Gradient Boosting
  # GradientBoosting:
  #   params:
  #     random_state: 42
  #     n_estimators: 100
  #     learning_rate: 0.1
  #     max_depth: 3
  #     subsample: 1.0
  #     min_samples_split: 2
  #     min_samples_leaf: 1
  # AdaBoost
  # AdaBoost:
  #   params:
  #     random_state: 42
  #     n_estimators: 50
  #     learning_rate: 1.0
  #     # algorithm: SAMME  # Leave unset; 'SAMME.R' was removed in scikit-learn 1.6
  # Decision Tree
  # DecisionTree:
  #   params:
  #     random_state: 42
  #     criterion: gini  # Options: gini, entropy
  #     splitter: best  # Options: best, random
  #     max_depth: null
  #     min_samples_split: 2
  #     min_samples_leaf: 1
  #     class_weight: balanced
# Visualization and Saving Configuration
# Generate performance plots (ROC, calibration, DCA, confusion matrix)
# 中文：`is_visualize` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `is_visualize` is a setting for this module; retain the example default initially and document any change.
is_visualize: true
# Save trained models to disk (.pkl files)
# 中文：`is_save_model` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `is_save_model` is a setting for this module; retain the example default initially and document any change.
is_save_model: true
# Notes
#

# 4. Feature selection methods with before_z_score: false run after normalization
# 5. Models are trained on features after all feature selection steps
#
# 4. Results visualization / Results visualization
# EN: All implemented evaluation figures are enabled for feature demonstration. SHAP can substantially increase runtime.
visualization:
  # EN: Enable every implemented evaluation figure, including the slower SHAP explanation plot.
  plot_types:
    - roc
    - dca
    - calibration
    - pr
    - confusion
    - shap

# =============================================================================
