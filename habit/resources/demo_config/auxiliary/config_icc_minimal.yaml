# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit icc -c <配置文件.yaml> 或 habit retest -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 0. 最小可运行配置 / Minimal — ICC
# 完整说明见 config_icc_demo.yaml
# 运行: habit icc -c config/auxiliary/config_icc_minimal.yaml
#
# 【YAML】路径一般不用引号；有空格时才加
# 注意：输入 CSV 中不要包含标签列

# 中文：★【必须检查】输入数据配置；多表时每一项都要填写路径、ID 列和标签列。
# EN: ★ REVIEW: Input-data configuration; for multiple tables, complete path, ID and label in each item.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
input:
  # 中文：`type` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `type` is a setting for this module; retain the example default initially and document any change.
  type: "files"
  # 中文：★【必须修改】每个列表是一组配对/重复测量特征表；不要将标签列用于 ICC。
  # EN: ★ MUST EDIT: Each list is a paired/repeated feature-table group; exclude outcome columns from ICC.
  # --- 1.1 file_groups ---
  file_groups:
    - [../../demo_data/ml_data/breast_cancer_dataset.csv, ../../demo_data/ml_data/breast_cancer_dataset_retest_simulated.csv]

# 中文：★【必须修改】本流程的结果输出目录；与 input 数据目录分开保存。
# EN: ★ MUST EDIT: Workflow output directory, kept separate from input data.
output:
  # 中文：★【必须修改】文件或目录路径；相对路径以本 YAML 所在文件夹为起点解析。
  # EN: ★ MUST EDIT: File or directory path; relative paths resolve from this YAML file.
  path: ../../demo_data/results/icc/icc_radiomics.json
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
# 中文：`metrics` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `metrics` is a setting for this module; retain the example default initially and document any change.
metrics:
  - icc2
  - icc3

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
# =============================================================================

# =============================================================================
# 3. 高级设置（首次保持默认）/ Advanced (keep defaults initially)
# EN: Advanced settings
processes: 1
# =============================================================================
