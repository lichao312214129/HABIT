# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit preprocess -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 中文：对医学影像做重采样 → 配准 → Z-score 标准化（按下方顺序执行）。
# EN:   Resample → registration → z-score (execution order = YAML order below).
#
# 运行 / Run:
#   habit preprocess -c config/preprocessing/config_preprocessing_demo.yaml
#
# 【你只需要改标了 ★ 的项】其余保持默认即可。
#   ★ 1. data_dir（输入影像根目录）
#   ★ 2. out_dir（输出目录）
#   ★ 3. 各步骤里的 images / fixed_image（模态名须与文件夹名一致）
#
# 【YAML 注意（不懂 YAML 请先看）】
#   - 用空格缩进，不要用 Tab；冒号后必须有空格：key: value
#   - true / false / null 一律小写
#   - 路径一般不用加引号。仅当路径含空格或特殊字符（如 # : *）时才加引号
#       例：D:/data/images           ← 可不加引号
#           "D:/my data/images"      ← 有空格时必须加引号
#   - Windows 路径推荐用正斜杠 /（如 D:/work/...），比反斜杠更不容易出错
#   - 列表用 - 开头并缩进对齐；用记事本/VS Code 保存为 .yaml，勿用 Word
#
# 路径约定：相对路径相对“本 YAML 所在目录”解析，不是命令行当前目录。
#   ../../demo_data/...  => 仓库根目录下的 demo_data/

# ★ 输入根目录：其下应有 images/<受试者>/<模态>/（可选 masks/）
#   填文件夹路径，不要填单个 .nii.gz 文件

# 中文：★【必须修改】输入数据根目录；填写文件夹或指定的清单 YAML，不要填写单个影像文件。
# EN: ★ MUST EDIT: Input root directory or manifest YAML; do not enter one image file.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
data_dir: ../../demo_data/preprocessed
# ★ 输出根目录（不存在会自动创建）
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: ../../demo_data/results/preprocessed

# 同一模态下有多个文件时，是否自动取第一个
# 中文：同一受试者/模态有多个文件时是否自动选第一个；DICOM 文件夹输入通常应为 false。
# EN: Whether to select the first file when multiple exist per subject/modality; normally false for DICOM folders.
auto_select_first_file: true

# 预处理步骤：YAML 书写顺序 = 执行顺序
# Step order in YAML = execution order

# 中文：预处理步骤；书写顺序就是执行顺序，首次使用请按示例保留。
# EN: Preprocessing steps; their YAML order is the execution order. Keep the example initially.
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
preprocessing:
  # 2.1 重采样 / Resample — 把体素间距统一到 target_spacing
  # 中文：`resample` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `resample` is a setting for this module; retain the example default initially and document any change.
  # --- 2.1 resample ---
  resample:
    # ★ 要处理的模态名（必须与 images 下文件夹名一致，如 LAP）
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [pre_contrast, LAP, PVP, delay_3min]
    # 目标体素间距 [x, y, z]，单位通常为 mm
    target_spacing: [3.0, 3.0, 3.0]
    # 影像插值：bilinear（常用）/ nearest 等
    # 中文：重采样插值方法；连续影像常用 bilinear，标签/掩膜通常用 nearest。
    # EN: Resampling interpolation; bilinear is common for images, nearest for labels/masks.
    img_mode: bilinear

  # 2.2 配准 / Registration — 把各模态对齐到固定影像
  # 中文：`registration` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `registration` is a setting for this module; retain the example default initially and document any change.

  # --- 2.2 registration ---
  registration:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [pre_contrast, LAP, PVP, delay_3min]
    # ★ 固定影像（参考模态），其他模态往它对齐
    # 中文：★【必须检查】配准参考模态；必须是 images 列表中的一个有效模态键。
    # EN: ★ REVIEW: Registration reference modality; it must be a valid key in the images list.
    fixed_image: LAP
    # 是否使用 mask 辅助配准（有 masks 时建议 true）
    use_mask: true
    # 配准后端：ants（推荐）或 elastix（需额外环境）
    # 中文：配准后端；应与已安装环境相符，首次使用保持示例后端。
    # EN: Registration backend; it must match the installed environment. Keep the example initially.
    backend: ants
    # 变换类型：Rigid（刚体，推荐起步）/ Affine / SyN 等
    # 中文：配准变换类型；Rigid 适合刚体对齐，复杂变换需额外验证形变合理性。
    # EN: Registration transform; Rigid suits rigid alignment. Complex transforms need deformation validation.
    type_of_transform: Rigid

  # 2.3 Z-score 标准化 / Z-score normalization
  # 中文：`zscore_normalization` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `zscore_normalization` is a setting for this module; retain the example default initially and document any change.

  # --- 2.3 zscore_normalization ---
  zscore_normalization:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [pre_contrast, LAP, PVP, delay_3min]
    # true=仅在 mask 内计算均值方差；false=整幅影像
    only_inmask: false
    # 标准化后裁剪到该范围，抑制极端值；不需要可删此行
    # 中文：标准化后的截断范围；用于限制极端值影响，留空或删除则不截断。
    # EN: Post-normalization clipping range; limits outlier influence. Empty/omitted means no clipping.
    clip_values: [-3, 3]
# =============================================================================

# =============================================================================
# 3. 高级设置（首次保持默认）/ Advanced (keep defaults initially)
# EN: Advanced settings
# 中文：`save_options` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
# EN: `save_options` is a setting for this module; retain the example default initially and document any change.
save_options:
  # 是否保存中间步骤结果（占磁盘；排查问题时可 true）
  # 中文：`save_intermediate` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `save_intermediate` is a setting for this module; retain the example default initially and document any change.
  save_intermediate: true
  # 中文：`intermediate_steps` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `intermediate_steps` is a setting for this module; retain the example default initially and document any change.
  intermediate_steps: []
# ⚠ 并行进程数：过大可能内存不足。笔记本建议 1–2
# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
processes: 2
# 中文：随机种子；保持固定可复现结果，除非研究设计明确要求改变。
# EN: Random seed; keep it fixed for reproducibility unless the study design requires otherwise.
random_state: 42
# =============================================================================
