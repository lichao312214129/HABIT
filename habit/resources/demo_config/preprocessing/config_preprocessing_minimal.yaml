# =============================================================================
# 0. 文件说明 / Overview
# 中文：首次使用时，只修改带 ★【必须修改】的字段；其余参数先保持默认。
# EN: For a first run, edit only fields marked ★ MUST EDIT and keep other defaults.
#
# 运行 / Run: habit preprocess -c <配置文件.yaml>
#
# 【YAML 防错 / YAML safety】
#   - 仅用空格缩进，不用 Tab；冒号后必须有一个空格：key: value
#   - true / false / null 必须小写
#   - 路径通常无需引号；含空格或 # : * 等特殊字符时才使用双引号
#       D:/data/images 可以；"D:/my data/images" 必须加引号
#   - Windows 路径推荐使用正斜杠 /；相对路径以本 YAML 文件夹为起点
#   - 修改后先运行：habit check-config -c <本文件.yaml>

# 0. 最小可运行配置 / Minimal — 影像预处理
# 中文：只含必改项与最少常用项。完整说明见 config_preprocessing_demo.yaml
# EN:   Must-edit fields only. See config_preprocessing_demo.yaml for full notes.
#
# 运行: habit preprocess -c config/preprocessing/config_preprocessing_minimal.yaml
#
# 【YAML】空格缩进；冒号后有空格；路径一般不用引号（有空格时才加，如 "D:/my data"）

# 中文：★【必须修改】输入数据根目录；填写文件夹或指定的清单 YAML，不要填写单个影像文件。
# EN: ★ MUST EDIT: Input root directory or manifest YAML; do not enter one image file.
# =============================================================================

# =============================================================================
# 1. ★【必须修改 / MUST EDIT】数据、路径与运行入口
# EN: Data, paths and run entry
data_dir: ../../demo_data/preprocessed   # ★ 输入根目录（含 images/）
# 中文：★【必须修改】结果输出目录；不存在时会自动创建，请确保有写入权限。
# EN: ★ MUST EDIT: Output directory. It is created when absent; ensure write permission.
out_dir: ../../demo_data/results/preprocessed             # ★ 输出目录

# 中文：预处理步骤；书写顺序就是执行顺序，首次使用请按示例保留。
# EN: Preprocessing steps; their YAML order is the execution order. Keep the example initially.
# =============================================================================

# =============================================================================
# 2. 常用流程与研究设置 / Common workflow and study settings
# EN: Common workflow and study settings
preprocessing:
  # 中文：`resample` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `resample` is a setting for this module; retain the example default initially and document any change.
  # --- 2.1 resample ---
  resample:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [pre_contrast, LAP, PVP, delay_3min]   # ★ 模态名=文件夹名
    target_spacing: [3.0, 3.0, 3.0]
    img_mode: bilinear
  # 中文：`registration` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `registration` is a setting for this module; retain the example default initially and document any change.

  # --- 2.2 registration ---
  registration:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [pre_contrast, LAP, PVP, delay_3min]
    # 中文：★【必须检查】配准参考模态；必须是 images 列表中的一个有效模态键。
    # EN: ★ REVIEW: Registration reference modality; it must be a valid key in the images list.
    fixed_image: LAP               # ★ 参考模态
    use_mask: true
    backend: ants
    # 中文：配准变换类型；Rigid 适合刚体对齐，复杂变换需额外验证形变合理性。
    # EN: Registration transform; Rigid suits rigid alignment. Complex transforms need deformation validation.
    type_of_transform: Rigid
  # 中文：`zscore_normalization` 是当前模块的配置项；首次运行请保留示例默认值，修改后记录原因。
  # EN: `zscore_normalization` is a setting for this module; retain the example default initially and document any change.

  # --- 2.3 zscore_normalization ---
  zscore_normalization:
    # 中文：★【必须检查】影像模态或影像清单；模态键必须与实际文件夹及后续配置完全一致。
    # EN: ★ REVIEW: Image modalities/manifest; modality keys must match folders and downstream config.
    images: [pre_contrast, LAP, PVP, delay_3min]
    only_inmask: false
    clip_values: [-3, 3]

# 中文：并行进程数；数值过大可能耗尽内存。普通电脑建议从 1–2 开始。
# EN: Parallel process count; too large can exhaust memory. Start with 1–2 on ordinary PCs.
# =============================================================================

# =============================================================================
# 3. 高级设置（首次保持默认）/ Advanced (keep defaults initially)
# EN: Advanced settings
processes: 2
# =============================================================================
